x-akamai:
  path-info: /endpoints/{apiEndPointId}/show
parameters:
- $ref: ../parameters/api-end-point-id-path.yaml
post:
  operationId: post-endpoint-show
  summary: Show an endpoint
  tags:
  - Endpoints
  description: |
    Reveals a hidden endpoint and all its versions. A revealed endpoint appears in the [List endpoints](ref:get-endpoints) operation's response object by default, or when you set the operation's `show` query parameter to `ONLY_VISIBLE`. Running this operation affects the endpoint listing in the API Definitions user interface.
  responses:
    200:
      description: |
        Operation succeeded.
      content:
        application/json:
          example:
            $ref: ../examples/api-endpoint-with-resource-dto-example.json
          schema:
            $ref: ../schemas/api-endpoint-with-resource-dto-recurse-response.yaml
    400:
      description: |
        [Bad request](ref:400). Invalid data input.
      $ref: ../errors/400.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have access to the endpoint.
      $ref: ../errors/403.yaml
