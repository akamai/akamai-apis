x-akamai:
  path-info: /endpoints/{apiEndPointId}/versions/{versionNumber}/settings/error-responses
parameters:
- $ref: ../parameters/version-number-path.yaml
- $ref: ../parameters/api-end-point-id-path.yaml
get:
  operationId: get-error-response-setting
  summary: Get error response settings
  tags:
  - Error responses
  description: |
    Returns the error response settings configured for an endpoint version.
  responses:
    200:
      description: |
        The response shows current error settings.
      content:
        application/json:
          example:
            $ref: ../examples/error-responses-dto-response-example.json
          schema:
            $ref: ../schemas/error-responses-dto.yaml
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the API endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). This API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    415:
      $ref: ../errors/415.yaml
put:
  operationId: put-error-response-setting
  summary: Edit error response settings
  tags:
  - Error responses
  description: |
    Updates the error response settings configured for an endpoint version.
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/error-responses-dto-request-example.json
        schema:
          $ref: ../schemas/error-responses-dto.yaml
  responses:
    200:
      description: |
        Operation succeeded.
      content:
        application/json:
          example:
            $ref: ../examples/error-responses-dto-response-example.json
          schema:
            $ref: ../schemas/error-responses-dto.yaml
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the API endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). This API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    415:
      $ref: ../errors/415.yaml
