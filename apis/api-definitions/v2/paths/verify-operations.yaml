x-akamai:
  path-info: /verify-operations
post:
  operationId: post-operation
  summary: Verify existing operations
  tags:
  - Verify operations
  description: |
    Verify that operations exist. Specify a list of operation summaries and receive a list of matching operations and their details, along with any submission errors.
  requestBody:
    content:
      application/json:
        example:
          $ref: ../examples/verify-operation-list.json
        schema:
          $ref: ../schemas/verify-operation-list.yaml
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/operation-report.json
          schema:
            $ref: ../schemas/operation-report.yaml
    400:
      description: |
        [Bad request](ref:400). The request body has invalid fields.
      $ref: ../errors/400-verify-op.yaml
