x-akamai:
  path-info: /endpoints/{apiEndPointId}/versions/{versionNumber}/settings/routing
parameters:
- $ref: ../parameters/version-number-path.yaml
- $ref: ../parameters/api-end-point-id-path.yaml
get:
  operationId: get-routing-settings
  summary: Get routing settings
  tags:
  - Routing
  description: |
    Returns the incoming request's routing, forwarding, and SureRoute settings configured for an endpoint version. You can run this operation if you're taking part in the API Gateway beta program.
  responses:
    200:
      description: |
        The response shows the current routing settings.
      content:
        application/json:
          example:
            $ref: ../examples/routing-example.json
          schema:
            $ref: ../schemas/routing-settings-dto.yaml
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the API endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). This API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    415:
      $ref: ../errors/415.yaml
put:
  operationId: put-routing-settings
  summary: Edit routing settings
  tags:
  - Routing
  description: |
    Updates the incoming request's routing, forwarding, and SureRoute settings configured for an endpoint version. You can run this operation if you're taking part in the API Gateway beta program.
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/routing-example.json
        schema:
          $ref: ../schemas/routing-settings-dto.yaml
  responses:
    200:
      description: |
        The response reflects your updated routing settings.
      content:
        application/json:
          example:
            $ref: ../examples/routing-example.json
          schema:
            $ref: ../schemas/routing-settings-dto.yaml
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the API endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). This API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    415:
      $ref: ../errors/415.yaml
