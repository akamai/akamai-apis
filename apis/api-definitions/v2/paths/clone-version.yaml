x-akamai:
  path-info: /endpoints/{apiEndPointId}/versions/{versionNumber}/cloneVersion
parameters:
- $ref: ../parameters/version-number-path.yaml
- $ref: ../parameters/api-end-point-id-path.yaml
post:
  operationId: post-endpoint-version-clone
  summary: Clone a version
  tags:
  - Versions
  description: |
    Creates a new endpoint version as a clone of an existing version. The system assigns a new number to the version that you clone.
  responses:
    200:
      description: |
        Updated API Endpoint.
      content:
        application/json:
          example:
            $ref: ../examples/api-endpoint-clone-dto-postresult-example.json
          schema:
            $ref: ../schemas/api-endpoint-with-resource-dto-recurse-response.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have access to the endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). The API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    409:
      description: |
        [Conflict](ref:409).
      $ref: ../errors/409.yaml
