x-akamai:
  path-info: /endpoints/{apiEndPointId}/versions/{versionNumber}/settings/graphql
parameters:
- $ref: ../parameters/version-number-path.yaml
- $ref: ../parameters/api-end-point-id-path.yaml
get:
  operationId: get-graphql-settings
  summary: Get GraphQL cache settings
  tags:
  - GraphQL
  description: |
    Returns the GraphQL caching settings configured for an endpoint version.
  responses:
    200:
      description: |
        The response shows current GraphQL cache settings.
      content:
        application/json:
          example:
            $ref: ../examples/graph-ql-example.json
          schema:
            $ref: ../schemas/graph-ql-settings-dto.yaml
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the API endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). This API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    415:
      $ref: ../errors/415.yaml
put:
  operationId: put-graphql-settings
  summary: Edit GraphQL cache settings
  tags:
  - GraphQL
  description: |
    Updates the GraphQL caching settings configured for an endpoint version.
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/graph-ql-example.json
        schema:
          $ref: ../schemas/graph-ql-settings-dto.yaml
  responses:
    200:
      description: |
        The response reflects updated GraphQL cache settings.
      content:
        application/json:
          example:
            $ref: ../examples/graph-ql-example.json
          schema:
            $ref: ../schemas/graph-ql-settings-dto.yaml
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the API endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). This API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    415:
      $ref: ../errors/415.yaml
