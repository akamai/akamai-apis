x-akamai:
  path-info: /endpoints/{apiEndPointId}/versions/{versionNumber}/settings/api-privacy
parameters:
- $ref: ../parameters/version-number-path.yaml
- $ref: ../parameters/api-end-point-id-path.yaml
get:
  operationId: get-api-privacy-settings
  summary: Get API privacy settings
  tags:
  - API privacy
  description: |
    Returns the API privacy settings configured for an endpoint version and its assigned resources.
  responses:
    200:
      description: |
        Operation succeeded.
      content:
        application/json:
          example:
            $ref: ../examples/api-privacy-settings-dto-response-example.json
          schema:
            $ref: ../schemas/api-privacy-settings-dto.yaml
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the API endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). This API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    415:
      $ref: ../errors/415.yaml
put:
  operationId: put-api-privacy-settings
  summary: Edit API privacy settings
  tags:
  - API privacy
  description: |
    Updates the API privacy settings configured for an endpoint version and its assigned resources.
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/api-privacy-settings-dto-request-example.json
        schema:
          $ref: ../schemas/api-privacy-settings-dto.yaml
  responses:
    200:
      description: |
        The response shows updated privacy settings.
      content:
        application/json:
          example:
            $ref: ../examples/api-privacy-settings-dto-response-example.json
          schema:
            $ref: ../schemas/api-privacy-settings-dto.yaml
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the API endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). This API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    415:
      $ref: ../errors/415.yaml
