x-akamai:
  path-info: /endpoints/{endpointId}/versions/{versionNumber}/resources-and-operations
parameters:
- $ref: ../parameters/endpoint-id.yaml
- $ref: ../parameters/version-number.yaml
get:
  operationId: get-resources-and-operations
  summary: List resources and operations
  tags:
  - Resources and operations
  description: |
    List all of your resources and resource operations for an API endpoint.
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/operation-report.json
          schema:
            $ref: ../schemas/operation-report.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the resource.
      $ref: ../errors/403-error.yaml
    404:
      description: |
        [Not found](ref:404). The resource doesn't exist.
      $ref: ../errors/404-version.yaml
