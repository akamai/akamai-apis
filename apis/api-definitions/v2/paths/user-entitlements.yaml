x-akamai:
  path-info: /endpoints/user-entitlements
get:
  operationId: get-user-entitlements
  summary: List user entitlements
  tags:
  - Endpoints
  description: |
    Lists user entitlements based on your assigned permissions. It helps you determine if your user identity assigned to the API client can run various other operations to modify data. See [Get started](ref:api-get-started) for details on setting up the API client with the appropriate level of access. This operation's array values include `API_READ` for read-only access, `API_WRITE` for modifying the existing endpoint versions, `API_VERSIONING` for version management, `API_FEATURES` for access to App & API Protector security features, `AAG_FEATURES` for access to delivery features, and `API_PURPOSE` for access to resource purpose settings. Note that the `API_FEATURES` permission is only available for App & API Protector customers, and the `API_PURPOSE` permission is for Bot Manager customers.
  responses:
    200:
      description: |
        Set of entitlements.
      content:
        application/json:
          example:
            $ref: ../examples/user-entitlements-dto-example.json
          schema:
            $ref: ../schemas/user-entitlements-dto.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have access to the endpoint.
      $ref: ../errors/403.yaml
