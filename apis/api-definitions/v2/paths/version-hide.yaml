x-akamai:
  path-info: /endpoints/{apiEndPointId}/versions/{versionNumber}/hide
parameters:
- $ref: ../parameters/version-number-path.yaml
- $ref: ../parameters/api-end-point-id-path.yaml
post:
  operationId: post-endpoint-version-hide
  summary: Hide a version
  tags:
  - Versions
  description: |
    Hides an endpoint version. You can only hide inactive or deactivated versions. You can't activate or delete hidden versions. A hidden endpoint version appears in the [List versions](ref:get-endpoint-versions) operation's response object with the `hidden` parameter set to `true`. Running this operation affects the version listing in the API Definitions user interface.
  responses:
    200:
      description: |
        Operation succeeded.
      content:
        application/json:
          example:
            $ref: ../examples/api-endpoint-with-resource-dto-example.json
          schema:
            $ref: ../schemas/api-endpoint-with-resource-dto-recurse-response.yaml
    400:
      description: |
        [Bad request](ref:400). Invalid data input.
      $ref: ../errors/400.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have access to the endpoint.
      $ref: ../errors/403.yaml
