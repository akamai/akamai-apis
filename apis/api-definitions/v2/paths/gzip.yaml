x-akamai:
  path-info: /endpoints/{apiEndPointId}/versions/{versionNumber}/settings/gzip
parameters:
- $ref: ../parameters/version-number-path.yaml
- $ref: ../parameters/api-end-point-id-path.yaml
get:
  operationId: get-gzip-settings
  summary: Get GZIP settings
  tags:
  - GZIP
  description: |
    Returns the GZIP compression settings configured for an endpoint version.
  responses:
    200:
      description: |
        The response shows current GZIP settings.
      content:
        application/json:
          example:
            $ref: ../examples/gzip-dto-example.json
          schema:
            $ref: ../schemas/gzip-dto.yaml
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the API endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). This API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    415:
      $ref: ../errors/415.yaml
put:
  operationId: put-gzip-settings
  summary: Edit GZIP settings
  tags:
  - GZIP
  description: |
    Updates the GZIP compression settings configured for an endpoint version.
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/gzip-dto-example.json
        schema:
          $ref: ../schemas/gzip-dto.yaml
  responses:
    200:
      description: |
        The response reflects your updated GZIP settings.
      content:
        application/json:
          example:
            $ref: ../examples/gzip-dto-example.json
          schema:
            $ref: ../schemas/gzip-dto.yaml
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the API endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). This API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    415:
      $ref: ../errors/415.yaml
