x-akamai:
  path-info: /endpoints/{apiEndPointId}
parameters:
- $ref: ../parameters/api-end-point-id-path.yaml
delete:
  operationId: delete-endpoint
  summary: Delete an endpoint
  tags:
  - Endpoints
  description: |
    Removes an endpoint configuration from API Gateway if none of the endpoint's versions are active or pending activation on the staging or production network.
  responses:
    204:
      description: |
        Resource successfully deleted.
    403:
      description: |
        [Forbidden](ref:403). You don't have access to the endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). The API endpoint doesn't exist.
      $ref: ../errors/404.yaml
