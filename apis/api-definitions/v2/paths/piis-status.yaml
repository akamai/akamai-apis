x-akamai:
  path-info: /endpoints/{apiEndPointId}/versions/{versionNumber}/piis/status
parameters:
- $ref: ../parameters/api-end-point-id-path.yaml
- $ref: ../parameters/version-number-path.yaml
post:
  operationId: post-endpoint-version-pii-status-from-register-form
  summary: Modify PII status per endpoint version
  tags:
  - Personally identifiable information
  description: |
    Update the PII status. This operation applies to PII found by the network and not PII you add to your API definition yourself.
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/pii-update-status-per-param-id-example.json
        schema:
          $ref: ../schemas/pii-update-status-per-param-id-dto.yaml
  responses:
    204:
      description: |
        Successfully updated the PII status.
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to update PII status.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). The API endpoint doesn't exist.
      $ref: ../errors/404.yaml
