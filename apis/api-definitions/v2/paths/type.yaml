x-akamai:
  path-info: /endpoints/{apiEndPointId}/versions/{versionNumber}/settings/error-responses/{type}
parameters:
- $ref: ../parameters/type-path.yaml
- $ref: ../parameters/version-number-path.yaml
- $ref: ../parameters/api-end-point-id-path.yaml
get:
  operationId: get-error-responses-type
  summary: Get an error response
  tags:
  - Error responses
  description: |
    Returns a customizable error response of the selected type.
  responses:
    200:
      description: |
        The response shows the current error response.
      content:
        application/json:
          example:
            $ref: ../examples/error-response-dto-response-example.json
          schema:
            $ref: ../schemas/error-response-dto.yaml
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the API endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). This API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    415:
      $ref: ../errors/415.yaml
put:
  operationId: put-get-error-responses-type
  summary: Edit an error response
  tags:
  - Error responses
  description: |
    Updates a customizable error response of the selected type.
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/error-response-dto-request-example.json
        schema:
          $ref: ../schemas/error-response-dto.yaml
  responses:
    200:
      description: |
        The response reflects the updated error response.
      content:
        application/json:
          example:
            $ref: ../examples/error-response-dto-response-example.json
          schema:
            $ref: ../schemas/error-response-dto.yaml
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the API endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). This API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    415:
      $ref: ../errors/415.yaml
