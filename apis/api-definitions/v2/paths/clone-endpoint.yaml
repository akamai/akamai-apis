x-akamai:
  path-info: /endpoints/cloneEndpoint
post:
  operationId: post-endpoint-clone
  summary: Clone an endpoint
  tags:
  - Endpoints
  description: |
    Creates an endpoint as a clone from the specified source endpoint ID and version.
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/api-endpoint-clone-dto-post-example.json
        schema:
          $ref: ../schemas/api-endpoint-clone-dto.yaml
  responses:
    200:
      description: |
        Created API Endpoint.
      headers:
        Location:
          description: |
            Relative URL for the cloned API endpoint.
          schema:
            type: string
      content:
        application/json:
          example:
            $ref: ../examples/api-endpoint-clone-dto-postresult-example.json
          schema:
            $ref: ../schemas/api-endpoint-with-resource-dto-recurse-response.yaml
    400:
      description: |
        [Bad request](ref:400). Some of user input is invalid.
      $ref: ../errors/400.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have access to the endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). The API endpoint doesn't exist.
      $ref: ../errors/404.yaml
