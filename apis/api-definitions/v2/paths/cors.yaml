x-akamai:
  path-info: /endpoints/{apiEndPointId}/versions/{versionNumber}/settings/cors
parameters:
- $ref: ../parameters/version-number-path.yaml
- $ref: ../parameters/api-end-point-id-path.yaml
get:
  operationId: get-cors-settings
  summary: Get CORS settings
  tags:
  - CORS
  description: |
    Returns the cross-origin resource sharing (CORS) settings configured for an endpoint version.
  responses:
    200:
      description: |
        Response data shows current CORS settings.
      content:
        application/json:
          example:
            $ref: ../examples/cors-dto-example.json
          schema:
            $ref: ../schemas/cors-dto.yaml
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the API endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). This API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    415:
      $ref: ../errors/415.yaml
put:
  operationId: put-cors-settings
  summary: Edit CORS settings
  tags:
  - CORS
  description: |
    Updates the cross-origin resource sharing (CORS) settings configured for an endpoint version.
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/cors-dto-example.json
        schema:
          $ref: ../schemas/cors-dto.yaml
  responses:
    200:
      description: |
        The response shows updated CORS data.
      content:
        application/json:
          example:
            $ref: ../examples/cors-dto-example.json
          schema:
            $ref: ../schemas/cors-dto.yaml
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the API endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). This API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    415:
      $ref: ../errors/415.yaml
