x-akamai:
  path-info: /search-operations
post:
  operationId: post-search-operation
  summary: Query operations
  tags:
  - Filter operations
  description: |
    Get a filtered list of operations and their endpoints and resources. You can filter by date ranges, activation statuses, API Endpoint hostnames, and resource paths. For a simpler search, run [Search operations](ref:get-search-operations).
  requestBody:
    content:
      application/json:
        example:
          $ref: ../examples/operations-search.json
        schema:
          $ref: ../schemas/operations-search.yaml
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/operation-report.json
          schema:
            $ref: ../schemas/operation-report.yaml
    400:
      description: |
        [Bad request](ref:400). The request body has invalid fields.
      $ref: ../errors/400-resource.yaml
get:
  operationId: get-search-operations
  summary: Search operations
  tags:
  - Filter operations
  description: |
    Get a filtered list of operations and their endpoints and resources. Use `queryType` to filter by date ranges or activation statuses. For more complex queries, run [Query operations](ref:post-search-operation).
  parameters:
  - $ref: ../parameters/query-type-query.yaml
  - $ref: ../parameters/active-start-time-query.yaml
  - $ref: ../parameters/active-end-time-query.yaml
  - $ref: ../parameters/include-details-query.yaml
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/operation-report.json
          schema:
            $ref: ../schemas/operation-report.yaml
