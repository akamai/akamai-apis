x-akamai:
  path-info: /endpoints/{apiEndPointId}/versions/{versionNumber}/piis/{piiId}/status
parameters:
- $ref: ../parameters/api-end-point-id-path.yaml
- $ref: ../parameters/version-number-path.yaml
- $ref: ../parameters/pii-id-path.yaml
patch:
  operationId: patch-endpoint-version-pii-status
  summary: Patch PII status per endpoint version
  tags:
  - Personally identifiable information
  description: |
    Update the PII status. This operation applies to PII found by the network and not PII you add to your API definition yourself.
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/pii-status-dto-example.json
        schema:
          $ref: ../schemas/pii-status-dto.yaml
  responses:
    200:
      description: |
        Successfully updated the PII status.
      content:
        application/json:
          example:
            $ref: ../examples/pii-dto-example.json
          schema:
            $ref: ../schemas/pii-dto.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to update PII status.
      $ref: ../errors/403.yaml
