x-akamai:
  path-info: /endpoints/{apiEndPointId}/versions/{versionNumber}/show
parameters:
- $ref: ../parameters/version-number-path.yaml
- $ref: ../parameters/api-end-point-id-path.yaml
post:
  operationId: post-version-show
  summary: Show a version
  tags:
  - Versions
  description: |
    Reveals a hidden endpoint version. A revealed endpoint version appears in the [List versions](ref:get-endpoint-versions) operation's response object with the `hidden` parameter set to `false`. Running this operation affects the version listing in the API Definitions user interface.
  responses:
    200:
      description: |
        Operation succeeded.
      content:
        application/json:
          example:
            $ref: ../examples/api-endpoint-with-resource-dto-example.json
          schema:
            $ref: ../schemas/api-endpoint-with-resource-dto-recurse-response.yaml
    400:
      description: |
        [Bad request](ref:400). Invalid data input.
      $ref: ../errors/400.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have access to the endpoint.
      $ref: ../errors/403.yaml
