x-akamai:
  path-info: /endpoints/{apiEndPointId}/versions/{versionNumber}/settings/cache
parameters:
- $ref: ../parameters/version-number-path.yaml
- $ref: ../parameters/api-end-point-id-path.yaml
get:
  operationId: get-cache-settings
  summary: Get cache settings
  tags:
  - Cache
  description: |
    Returns the caching settings configured for an endpoint version and its assigned resources. You can set all objects independently from the root `customize` field.
  responses:
    200:
      description: |
        Response data shows current cache settings.
      content:
        application/json:
          example:
            $ref: ../examples/cache-dto-example.json
          schema:
            $ref: ../schemas/cache-settings-dto.yaml
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the API endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). This API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    415:
      $ref: ../errors/415.yaml
put:
  operationId: put-cache-settings
  summary: Edit cache settings
  tags:
  - Cache
  description: |
    Updates the caching settings configured for an endpoint version and its assigned resources.
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/cache-dto-example.json
        schema:
          $ref: ../schemas/cache-settings-dto.yaml
  responses:
    200:
      description: |
        Operation succeeded.
      content:
        application/json:
          example:
            $ref: ../examples/cache-dto-example.json
          schema:
            $ref: ../schemas/cache-settings-dto.yaml
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the API endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). This API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    415:
      $ref: ../errors/415.yaml
