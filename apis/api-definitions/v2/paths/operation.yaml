x-akamai:
  path-info: /endpoints/{endpointId}/versions/{versionNumber}/resources/{apiResourceId}/operations/{operationId}
parameters:
- $ref: ../parameters/endpoint-id.yaml
- $ref: ../parameters/version-number.yaml
- $ref: ../parameters/api-resource-id.yaml
- $ref: ../parameters/operation-id.yaml
get:
  operationId: get-resource-operation
  summary: Get a resource operation
  tags:
  - Resource operations
  description: |
    Get details about a specific resource operation.
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/resource-operation.json
          schema:
            $ref: ../schemas/resource-operation.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the resource.
      $ref: ../errors/403-error.yaml
    404:
      description: |
        [Not found](ref:404). The resource doesn't exist.
      $ref: ../errors/404-resource.yaml
put:
  operationId: put-resource-operation
  summary: Update a resource operation
  tags:
  - Resource operations
  description: |
    Update details about a resource operation. You can change the operation's name, method, purpose, and more.
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/resource-operation.json
        schema:
          $ref: ../schemas/resource-operation.yaml
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/resource-operation.json
          schema:
            $ref: ../schemas/resource-operation.yaml
    400:
      description: |
        [Bad request](ref:400). The request body has invalid fields.
      $ref: ../errors/400-resource.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the resource.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). The requested resource operation doesn't exist.
      $ref: ../errors/404-resource.yaml
delete:
  operationId: delete-resource-operation
  summary: Delete a resource operation
  tags:
  - Resource operations
  description: |
    Remove a specific resource operation.
  responses:
    204:
      description: |
        Successful response.
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the resource.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). The requested resource operation doesn't exist.
      $ref: ../errors/404-resource.yaml
