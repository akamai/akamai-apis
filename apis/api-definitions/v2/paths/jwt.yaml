x-akamai:
  path-info: /endpoints/{apiEndPointId}/versions/{versionNumber}/settings/jwt
parameters:
- $ref: ../parameters/version-number-path.yaml
- $ref: ../parameters/api-end-point-id-path.yaml
get:
  operationId: get-jwt-settings
  summary: Get JWT settings
  tags:
  - JWT
  description: |
    Returns the JWT validation settings configured for an endpoint version and its assigned resources.
  responses:
    200:
      description: |
        The response shows the current JWT validation settings.
      content:
        application/json:
          example:
            $ref: ../examples/jwt-dto-response-example.json
          schema:
            $ref: ../schemas/jwt-dto.yaml
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the API endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). This API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    415:
      $ref: ../errors/415.yaml
put:
  operationId: put-jwt-settings
  summary: Edit JWT settings
  tags:
  - JWT
  description: |
    Updates the JWT validation settings configured for an endpoint version and its assigned resources.
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/jwt-dto-request-example.json
        schema:
          $ref: ../schemas/jwt-dto.yaml
  responses:
    200:
      description: |
        The response reflects your updated JWT validation settings.
      content:
        application/json:
          example:
            $ref: ../examples/jwt-dto-response-example.json
          schema:
            $ref: ../schemas/jwt-dto.yaml
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to access the API endpoint.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). This API endpoint doesn't exist.
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    415:
      $ref: ../errors/415.yaml
