x-akamai:
  path-info: /endpoints/{apiEndPointId}/versions/{versionNumber}/deactivate
parameters:
- $ref: ../parameters/version-number-path.yaml
- $ref: ../parameters/api-end-point-id-path.yaml
post:
  operationId: post-endpoint-version-deactivate
  summary: Deactivate a version
  tags:
  - Versions
  description: |
    Deactivates an endpoint version on the staging or production network. A deactivated endpoint version no longer serves traffic through the Akamai network.
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/activation-dto-example.json
        schema:
          $ref: ../schemas/activation-dto.yaml
  responses:
    200:
      description: |
        Returns deactivated entity.
      content:
        application/json:
          example:
            $ref: ../examples/activation-dto-example.json
          schema:
            $ref: ../schemas/activation-dto.yaml
    400:
      description: |
        [Bad request](ref:400). Some of the request input is invalid.
      $ref: ../errors/400.yaml
