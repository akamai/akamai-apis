x-akamai:
  path-info: /endpoints/{apiEndPointId}/versions/{versionNumber}/resources-detail
parameters:
- $ref: ../parameters/version-number-path.yaml
- $ref: ../parameters/api-end-point-id-path.yaml
get:
  operationId: get-version-details
  summary: Get a version
  tags:
  - Resources
  description: |
    Returns an endpoint version. Use this operation's response object when modifying an endpoint version through [Edit a version](ref:put-endpoint-version). Don't use [Get a version summary](ref:get-endpoint-version) for the [Edit a version](ref:put-endpoint-version) operation.
  responses:
    200:
      description: |
        Operation succeeded.
      content:
        application/json:
          example:
            $ref: ../examples/api-endpoint-with-resource-dto-example.json
          schema:
            $ref: ../schemas/api-endpoint-with-resource-dto-recurse-response.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to retrieve API endpoint list.
      $ref: ../errors/403.yaml
