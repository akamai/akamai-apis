x-akamai:
  path-info: /endpoints/{apiEndPointId}/versions
parameters:
- $ref: ../parameters/api-end-point-id-path.yaml
get:
  operationId: get-endpoint-versions
  summary: List versions
  tags:
  - Versions
  description: |
    Returns versions of an endpoint, with results optionally paginated, sorted, and filtered.
  parameters:
  - $ref: ../parameters/page-query.yaml
  - $ref: ../parameters/page-size-version-query.yaml
  - $ref: ../parameters/sort-by-version-query.yaml
  - $ref: ../parameters/sort-order-version-query.yaml
  - $ref: ../parameters/show-version-query.yaml
  responses:
    200:
      description: |
        Lists API endpoint versions you have access to in this account.
      content:
        application/json:
          example:
            $ref: ../examples/api-endpoint-version-list-dto-example.json
          schema:
            $ref: ../schemas/api-endpoint-version-list-dto.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have permission to retrieve the API endpoint versions list.
      $ref: ../errors/403.yaml
