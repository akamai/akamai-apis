type: object
description: |
  Collects data about operations, used in operation verification.
additionalProperties: false
required:
- apiEndPointId
- apiResourceLogicId
- operationId
properties:
  operationId:
    type: string
    description: |
      Identifies the resource operation.
    minLength: 36
    maxLength: 36
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  apiEndPointId:
    type: integer
    description: |
      Identifies the API endpoint.
  apiResourceLogicId:
    type: integer
    description: |
      Identifies the API resource.
