type: object
description: |
  PII list you want to add to the parameter.
additionalProperties: false
properties:
  types:
    type: array
    description: |
      The set of PII types you want to add to the parameter. The API supports `PERSONAL_EMAIL` or `CREDIT_OR_DEBIT_CARD_NUMBER`.
    items:
      type: string
      enum:
      - PERSONAL_EMAIL
      - CREDIT_OR_DEBIT_CARD_NUMBER
