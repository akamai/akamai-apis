type: object
description: |
  An endpoint version activation.
additionalProperties: false
nullable: true
properties:
  versionNumber:
    type: integer
    description: |
      The endpoint version number.
    nullable: true
    readOnly: true
  status:
    type: string
    description: |
      The activation status on the production network, either `PENDING` if the version contains changes that are being propagated to the network, `ACTIVE` if the version is active, `DEACTIVATED` if the version had been active once but has been deactivated, or `FAILED` if an activation or deactivation attempt for this version has failed. The value is `null` for versions that have never been activated on this network.
    nullable: true
    readOnly: true
    enum:
    - PENDING
    - ACTIVE
    - DEACTIVATED
    - FAILED
  timestamp:
    type: string
    description: |
      The ISO 8601 timestamp indicating the last update of the activation status.
    nullable: true
    readOnly: true
    format: date-time
  lastError:
    type: object
    description: |
      The last failed activation of the endpoint version.
    additionalProperties: false
    nullable: true
    properties:
      timestamp:
        type: string
        description: |
          The ISO 8601 timestamp indicating the last update of the activation status.
        nullable: true
        readOnly: true
        format: date-time
      status:
        type: string
        description: |
          The activation status on the production network, either `PENDING` if the version contains changes that are being propagated to the network, `ACTIVE` if the version is active, `DEACTIVATED` if the version had been active once but has been deactivated, or `FAILED` if an activation or deactivation attempt for this version has failed. The value is `null` for versions that have never been activated on this network.
        nullable: true
        readOnly: true
        enum:
        - PENDING
        - ACTIVE
        - DEACTIVATED
        - FAILED
      versionNumber:
        type: integer
        description: |
          The endpoint version number.
        nullable: true
        readOnly: true
