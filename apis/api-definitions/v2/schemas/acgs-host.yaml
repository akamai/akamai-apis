type: object
description: |
  A hostname and access control group where the hostname is registered.
additionalProperties: false
properties:
  hostname:
    type: string
    description: |
      The hostname that may receive traffic for an endpoint.
  acgId:
    type: string
    description: |
      The unique identifier for the access control group where the hostname is registered.
  contractId:
    type: string
    description: |
      The unique identifier for the Akamai contract within the access control group.
