type: object
description: |
  Contains debugging information for error responses.
additionalProperties: true
properties:
  type:
    type: string
    description: |
      The URL for the error type.
  title:
    type: string
    description: |
      The title of the error.
  detail:
    type: string
    description: |
      The detailed error message.
  errors:
    type: array
    description: |
      Nested error responses.
    items:
      $ref: http-problem-details-recurse.yaml
  instance:
    type: string
    description: |
      The non-referenceable URL for the error instance.
  status:
    type: integer
    description: |
      The HTTP status code.
