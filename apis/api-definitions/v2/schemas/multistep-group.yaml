type: object
description: |
  Collect data for your multistep group.
additionalProperties: false
required:
- multistepGroupId
- name
properties:
  name:
    type: string
    description: |
      The name of the multistep group.
    minLength: 1
  multistepGroupId:
    type: string
    description: |
      Identifies the multistep group. This applies only for the following operation types: `LOGIN`, `ACCOUNT_VERIFICATION`, `ACCOUNT_CREATION`, `PASSWORD_RESET`, or `PAYMENT`.
