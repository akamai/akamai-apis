type: object
description: |
  Provides details on the data object that reflects the API’s common response to error cases, and lists the API’s range of response status codes for both error and success cases.
additionalProperties: true
required:
- type
- status
- title
- detail
- instance
properties:
  type:
    type: string
    description: |
      The URL for the error type.
  title:
    type: string
    description: |
      The name of the error.
  detail:
    type: string
    description: |
      The detailed error message.
  errors:
    type: array
    description: |
      Detailed error messages provided by the server.
    items:
      $ref: problem-nested.yaml
  instance:
    type: string
    description: |
      The URI that indicates the error instance.
  status:
    type: integer
    description: |
      The HTTP status code.
  fieldErrors:
    type: object
    description: |
      Pointers to fields with invalid input. Values are messages that explain why the input is invalid.
    additionalProperties:
      type: array
      description: |
        Additional error details.
      minItems: 1
      uniqueItems: true
      items:
        type: string
