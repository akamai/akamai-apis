type: object
description: |
  Collects data for restrictions on the method level.
additionalProperties: false
nullable: true
properties:
  allowMethodUndefinedParameters:
    type: object
    description: |
      Specify whether undefined parameters are allowed, overriding the top-level setting for undefined parameters.
    additionalProperties: false
    required:
    - header
    - cookie
    - query
    - body
    properties:
      header:
        type: boolean
        description: |
          Whether undefined parameters are allowed in request headers.
      cookie:
        type: boolean
        description: |
          Whether undefined parameters are allowed in request cookies.
      query:
        type: boolean
        description: |
          Whether undefined parameters are allowed in request query string.
      body:
        type: boolean
        description: |
          Whether undefined parameters are allowed in request body.
  jsonRequestRejectDuplicates:
    type: boolean
    description: |
      Whether to reject duplicate JSON requests.
