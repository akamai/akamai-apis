type: object
description: |
  All versions of an endpoint.
additionalProperties: false
required:
- apiEndPointId
properties:
  page:
    type: integer
    description: |
      The number of the current page with results.
    default: 1
    minimum: 1
  pageSize:
    type: integer
    description: |
      The number of endpoint versions on each page with results.
    default: 2147483647
  totalSize:
    type: integer
    description: |
      The total number of endpoint versions available in the returned set.
  apiEndPointId:
    type: integer
    description: |
      The unique identifier for the endpoint.
  apiEndPointName:
    type: string
    description: |
      The name of the endpoint, unique within the account.
  apiVersions:
    type: array
    description: |
      Each endpoint version within a collection.
    items:
      type: object
      additionalProperties: false
      required:
      - lockVersion
      - versionNumber
      properties:
        description:
          type: string
          description: |
            The description of the endpoint version. If you specify `null` in the request or omit this field from the object, the JSON response reflects it as an empty string.
          nullable: true
        apiEndPointVersionId:
          type: integer
          description: |
            The unique identifier for the endpoint version.
        availableActions:
          type: array
          description: |
            Available [actions](https://techdocs.akamai.com/api-definitions/docs/api-config-version-mgmt#actions) that you can perform on the version depending on the version's activation status.
          items:
            type: string
            enum:
            - CLONE_ENDPOINT
            - CLONE_VERSION
            - DELETE
            - RESOURCES
            - COMPARE_ENDPOINT
            - COMPARE_AAG_SETTINGS
            - COMPARE_RESOURCE_PURPOSES
            - COMPARE_RAPID_SETTINGS
            - VIEW_AAG_SETTINGS
            - EDIT_AAG_SETTINGS
            - EDIT_ENDPOINT_DEFINITION
            - ACTIVATE_ON_STAGING
            - ACTIVATE_ON_PRODUCTION
            - DEACTIVATE_ON_STAGING
            - DEACTIVATE_ON_PRODUCTION
            - HIDE_VERSION
            - SHOW_VERSION
          x-akamai:
            enum-descriptions:
              CLONE_ENDPOINT: |
                Clone the endpoint from another existing endpoint.
              CLONE_VERSION: |
                Clone a new version from another existing version.
              DELETE: |
                Delete the version. Only available for inactive versions.
              RESOURCES: |
                View resources.
              COMPARE_ENDPOINT: |
                Compare the endpoint between different versions.
              COMPARE_AAG_SETTINGS: |
                Compare AAG settings between different versions.
              COMPARE_RESOURCE_PURPOSES: |
                Compare resource purposes between different versions.
              COMPARE_RAPID_SETTINGS: |
                Compare RAPID settings between different versions.
              VIEW_AAG_SETTINGS: |
                View AAG settings.
              EDIT_AAG_SETTINGS: |
                Edit AAG settings.
              EDIT_ENDPOINT_DEFINITION: |
                Edit the endpoint definition.
              ACTIVATE_ON_STAGING: |
                Activate on staging. Available when version is inactive or deactivated.
              ACTIVATE_ON_PRODUCTION: |
                Activate on production. Available when version is inactive or deactivated.
              DEACTIVATE_ON_STAGING: |
                Deactivate on staging. Available when version is active.
              DEACTIVATE_ON_PRODUCTION: |
                Deactivate on production. Available when version is active.
              HIDE_VERSION: |
                Hide the version so that it no longer appears in the version history. You can't activate or delete hidden versions.
              SHOW_VERSION: |
                Reveal the version so that it becomes visible in the version history.
        basePath:
          type: string
          description: |
            The URL path that serves as a root prefix for all resources' `resourcePath` values. This is `/` if empty. Don't append a `/` character to the path. If you specify `null` in the request or omit this field from the object, the JSON response reflects it as an empty string.
          nullable: true
        basedOn:
          type: integer
          description: |
            For cloned versions, the unique identifier for the source version.
          nullable: true
        createDate:
          type: string
          description: |
            The ISO 8601 timestamp indicating when you created the endpoint version.
          format: date-time
        createdBy:
          type: string
          description: |
            The identifier for the user who created the version.
        hidden:
          type: boolean
          description: |
            Indicates whether the endpoint version is hidden. You cannot activate or delete hidden versions. If you want to do so, you first need to reveal the version by running the [Show a version](ref:post-version-show) operation.
        isVersionLocked:
          type: boolean
          description: |
            Whether the endpoint version is read-only.
        lockVersion:
          type: integer
          description: |
            The identifier for the last modification of an endpoint version, used for optimistic locking. See [Concurrency control](ref:concurrency-control) for details.
        productionDate:
          type: string
          description: |
            The ISO 8601 timestamp indicating when you activated the endpoint version on the production network.
          nullable: true
          format: date-time
        productionStatus:
          type: string
          description: |
            The version activation status on the production network, either `PENDING` if the version contains changes that are being propagated to the network, `ACTIVE` if the version is active, `DEACTIVATED` if the version was once active but is deactivated, or `FAILED` if an activation or deactivation attempt for this version has failed. The value is `null` for versions that have never been activated on this network.
          nullable: true
          enum:
          - PENDING
          - ACTIVE
          - DEACTIVATED
          - FAILED
        stagingDate:
          type: string
          description: |
            The ISO 8601 timestamp indicating when you activated the endpoint version on the staging network.
          nullable: true
          format: date-time
        stagingStatus:
          type: string
          description: |
            The version activation status on the staging network, either `PENDING` if the version contains changes that are being propagated to the network, `ACTIVE` if the version is active, `DEACTIVATED` if the version was once active but is deactivated, or `FAILED` if an activation or deactivation attempt for this version has failed. The value is `null` for versions that have never been activated on this network.
          nullable: true
          enum:
          - PENDING
          - ACTIVE
          - DEACTIVATED
          - FAILED
        updateDate:
          type: string
          description: |
            The ISO 8601 timestamp indicating when you last modified the endpoint version.
          format: date-time
        updatedBy:
          type: string
          description: |
            The identifier for the user who last modified the version.
        versionNumber:
          type: integer
          description: |
            The endpoint version number.
