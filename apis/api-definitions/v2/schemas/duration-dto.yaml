type: object
description: |
  The maximum duration to keep content in a cache.
additionalProperties: false
required:
- duration
- unit
nullable: true
properties:
  duration:
    type: integer
    description: |
      The maximum duration of content caching in the selected unit of time.
  unit:
    type: string
    description: |
      The unit of time for content caching, either `SECONDS`, `MINUTES`, `HOURS`, or `DAYS`.
    enum:
    - SECONDS
    - MINUTES
    - HOURS
    - DAYS
