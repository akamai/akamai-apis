type: object
description: |
  JWT validation settings for each resource assigned to an endpoint version. The resources are available through a map of `resourceId` keys.
title: The map of resource ID to settings.
additionalProperties:
  type: object
  description: |
    JWT settings configured for a resource.
  additionalProperties: false
  required:
  - enabled
  properties:
    enabled:
      type: boolean
      description: |
        Whether you enabled JWT validation for the resource.
    path:
      type: string
      description: |
        The URL path relative to the hostnames on which the resource resides.
      readOnly: true
    notes:
      type: string
      description: |
        The description of the resource.
      nullable: true
      readOnly: true
    methods:
      type: array
      description: |
        The methods assigned to the resource, either `POST`, `GET`, `PUT`, `DELETE`, `HEAD`, `OPTIONS`, or `PATCH`.
      readOnly: true
      items:
        type: string
        enum:
        - HEAD
        - DELETE
        - POST
        - GET
        - OPTIONS
        - PUT
        - PATCH
    inheritsFromEndpoint:
      type: boolean
      description: |
        Whether the resource inherits the top-level JWT settings.
      readOnly: true
