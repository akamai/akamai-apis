type: object
description: |
  OAuth scopes assigned to each method assigned to a resource. The methods are available through a map of `apiResourceMethod` keys.
title: The map of HTTP method name to settings.
additionalProperties: false
properties:
  notes:
    type: string
    description: |
      The description of the method.
    nullable: true
    readOnly: true
  scopes:
    type: array
    description: |
      The scopes that define the level of client apps' access to the method.
    items:
      type: string
