type: object
description: |
  An endpoint category.
additionalProperties: false
required:
- apiCategoryName
properties:
  apiCategoryDescription:
    type: string
    description: |
      The description of the category that you may use to tag related endpoints. If you specify `null` or an empty string in the request, the JSON response doesn't include this field.
    nullable: true
  apiCategoryId:
    type: integer
    description: |
      The unique identifier for the category.
    readOnly: true
  apiCategoryName:
    type: string
    description: |
      The unique-per-account name of the category. Any empty value reflects back as an `__UNCATEGORIZED__` keyword.
  createDate:
    type: string
    description: |
      The ISO 8601 timestamp indicating when you created the category.
    readOnly: true
    format: date-time
  createdBy:
    type: string
    description: |
      The identifier for the user who created the category.
    readOnly: true
  link:
    type: string
    description: |
      The location of the navigable resource within this API, for use by API clients.
    readOnly: true
  lockVersion:
    type: integer
    description: |
      The identifier used for optimistic locking. See [Concurrency control](ref:concurrency-control) for details.
    readOnly: true
  updateDate:
    type: string
    description: |
      The ISO 8601 timestamp indicating when you last modified the category.
    readOnly: true
    format: date-time
  updatedBy:
    type: string
    description: |
      The identifier for the user who last modified the category.
    readOnly: true
  usageCount:
    type: integer
    description: |
      The number of endpoints that share the category.
    readOnly: true
