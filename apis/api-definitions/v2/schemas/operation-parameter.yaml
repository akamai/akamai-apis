type: object
description: |
  Collects data for operation parameters defined when the resource was created.
additionalProperties:
  type: object
  description: |
    Additional properties describing the parameter.
  additionalProperties: false
  properties:
    parameterId:
      type: integer
      description: |
        Identifies the parameter.
      format: int64
    referenceOperationId:
      type: string
      description: |
        Identifies the referred operation.
      nullable: true
    referenceOperationLocation:
      type: string
      description: |
        Identifies the operation parameter location of the referred operation, either `USERNAME`, `USER_EMAIL`, `USER_PHONE_NUMBER`, `USER_FIRST_NAME`, `USER_LAST_NAME`, or `USER_OTHER_ID`.
      nullable: true
      enum:
      - USERNAME
      - USER_EMAIL
      - USER_PHONE_NUMBER
      - USER_OTHER_ID
      - USER_FIRST_NAME
      - USER_LAST_NAME
    usedForLogin:
      type: boolean
      description: |
        Indicates if the parameter is used for login.
      nullable: true
    arrayIndexes:
      type: array
      description: |
        Corresponding array parameters used to find data.
      items:
        $ref: operation-atomic-condition-array-index.yaml
nullable: true
properties:
  username:
    type: object
    description: |
      If the `operationPurpose` supports a username, specify the `apiParameterId` you defined when you [created the resource](ref:post-resource). Required for `LOGIN`, `ACCOUNT_VERIFICATION`, and `PASSWORD RESET`.
  userOtherId:
    type: object
    description: |
      If the `operationPurpose` is `ACCOUNT_CREATION`, specify the `apiParameterId` you defined when you [created the resource](ref:post-resource).
  userEmail:
    type: object
    description: |
      If the `operationPurpose` is `ACCOUNT_CREATION` or `PAYMENT`, specify the `apiParameterId` you defined when you [created the resource](ref:post-resource).
  userPhoneNumber:
    type: object
    description: |
      If the `operationPurpose` is `ACCOUNT_CREATION` or `PAYMENT`, specify the `apiParameterId` you defined when you [created the resource](ref:post-resource).
  userFirstName:
    type: object
    description: |
      If the `operationPurpose` is `ACCOUNT_CREATION`, specify the `apiParameterId` you defined when you [created the resource](ref:post-resource).
  userLastName:
    type: object
    description: |
      If the `operationPurpose` is `ACCOUNT_CREATION`, specify the `apiParameterId` you defined when you [created the resource](ref:post-resource).
