type: object
description: |
  Cache prefreshing settings. When enabled, edge servers asynchronously refresh cached objects after a specified percentage of the object's TTL elapses.
additionalProperties: false
required:
- enabled
nullable: true
properties:
  value:
    type: integer
    description: |
      With TTL the duration before cached content ordinarily refreshes, this refreshes content before then, expressed as a percentage of the TTL, from 0 to 99.
    minimum: 0
    maximum: 99
  enabled:
    type: boolean
    description: |
      Whether you enable cache prefreshing.
