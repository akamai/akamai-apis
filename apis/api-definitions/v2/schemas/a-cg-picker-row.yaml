type: object
description: |
  A pairing of contract and group under which you provision the security and delivery settings for an endpoint.
additionalProperties: false
properties:
  displayName:
    type: string
    description: |
      The descriptive name for the pairing of contract and group.
  acgId:
    type: string
    description: |
      The unique identifier for the pairing of contract and group.
  groupId:
    type: integer
    description: |
      The unique identifier for the group within the pairing.
  contractId:
    type: string
    description: |
      The unique identifier for the Akamai contract within the pairing.
