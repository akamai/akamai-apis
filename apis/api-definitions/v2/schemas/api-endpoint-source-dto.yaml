type: object
additionalProperties: false
nullable: true
properties:
  type:
    type: string
    description: |
      The specification of the import file you uploaded to create the endpoint version. Either `SWAGGER` or `RAML`.
    nullable: true
    readOnly: true
    enum:
    - SWAGGER
    - RAML
  apiVersion:
    type: string
    description: |
      The major version of the API defined in the import file.
    nullable: true
    readOnly: true
  specificationVersion:
    type: string
    description: |
      The version of the import file's specification.
    nullable: true
    readOnly: true
