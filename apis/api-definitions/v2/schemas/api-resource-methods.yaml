type: object
description: |
  An HTTP method to which a resource may respond.
additionalProperties: false
required:
- apiResourceMethod
properties:
  apiResourceMethodId:
    type: integer
    description: |
      The unique identifier for the resource's allowed method.
  apiResourceMethod:
    type: string
    description: |
      The core HTTP method to which the resource may respond, either `GET`, `PUT`, `POST`, `DELETE`, `HEAD`, `PATCH`, or `OPTIONS`.
    enum:
    - DELETE
    - GET
    - PATCH
    - PUT
    - POST
    - OPTIONS
    - HEAD
  apiResourceMethodLogicId:
    type: integer
    description: |
      The unique identifier for the resource's method across all endpoint versions.
  apiParameters:
    type: array
    description: |
      Parameter objects associated with the method.
    items:
      $ref: api-parameters.yaml
  methodRestrictions:
    $ref: method-restrictions.yaml
