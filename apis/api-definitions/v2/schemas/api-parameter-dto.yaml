type: object
description: |
  A method's parameter.
required:
- apiParameterName
- apiParameterType
- apiParameterRequired
- apiParameterLocation
properties:
  apiParameterId:
    type: integer
    description: |
      The unique identifier for the parameter.
    readOnly: true
  apiParameterName:
    type: string
    description: |
      The name of the parameter. If the corresponding `apiParameterLocation` is `path`, ensure that this value matches the parameter name you specified in the `resourcePath`.
  apiParameterRequired:
    type: boolean
    description: |
      Specifies whether the API user needs to specify the parameter. If the corresponding `apiParameterLocation` is `path`, set this field to `true`.
  response:
    type: boolean
    description: |
      Whether the parameter is within a response type.
  apiParameterLocation:
    type: string
    description: |
      The location of the parameter in an HTTP request, either `query`, `header`, `path`, `cookie`, or `body` for a JSON or XML body type parameter.
    enum:
    - query
    - header
    - path
    - cookie
    - body
  pathParamLocationId:
    type: integer
    description: |
      The index of a segment that includes a path parameter in a resource path. For example, given a path `\books\{bookId}`, the `books` segment has index `0`, and the path parameter `{bookId}` has index `1`.
    nullable: true
  apiParameterType:
    type: string
    description: |
      The data type of the parameter, either `string`, `integer`, `number`, `boolean`, or `json/xml` for JSON or XML objects.
    enum:
    - string
    - integer
    - number
    - boolean
    - json/xml
  array:
    type: boolean
    description: |
      Whether the parameter can express more than one value. This field is only applicable for `apiChildParameters` that you can specify if the corresponding `apiParameterLocation` is `body` and the `apiParameterType` is `json/xml`. If you enable this, also define the `arrayRestriction` field.
  apiParamLogicId:
    type: integer
    description: |
      The unique identifier for the parameter across all endpoint versions.
    readOnly: true
  apiResourceMethParamId:
    type: integer
    description: |
      The unique identifier for the parameter's parent method.
    nullable: true
    readOnly: true
  apiParameterNotes:
    type: string
    description: |
      The description to clarify the parameter's function. If you specify an empty string in the request or omit this field from the object, the JSON response reflects it as `null`.
    nullable: true
  apiParameterRestriction:
    type: object
    description: |
      Restrictions and XML representation rules specified for the parameter.
    additionalProperties: false
    nullable: true
    properties:
      lengthRestriction:
        type: object
        description: |
          Length restrictions for string type parameters.
        additionalProperties: false
        nullable: true
        properties:
          lengthMax:
            type: integer
            description: |
              The maximum allowed number of characters in the string.
            nullable: true
          lengthMin:
            type: integer
            description: |
              The minimum allowed number of characters in the string.
            nullable: true
      rangeRestriction:
        type: object
        description: |
          Range restrictions for integer type parameters.
        additionalProperties: false
        nullable: true
        properties:
          rangeMin:
            type: integer
            description: |
              The minimum range restriction.
            nullable: true
          rangeMax:
            type: integer
            description: |
              The maximum range restriction.
            nullable: true
      numberRangeRestriction:
        type: object
        description: |
          Range restrictions for number type parameters.
        additionalProperties: false
        nullable: true
        properties:
          numberRangeMin:
            type: number
            description: |
              The minimum range restriction.
            nullable: true
          numberRangeMax:
            type: number
            description: |
              The maximum range restriction.
            nullable: true
      arrayRestriction:
        type: object
        description: |
          Restrictions for array type parameters. Define this object only if you enabled the corresponding `array` field.
        additionalProperties: false
        nullable: true
        properties:
          minItems:
            type: integer
            description: |
              The minimum allowed number of array items.
            minimum: 0
            maximum: 256
          maxItems:
            type: integer
            description: |
              The maximum allowed number of array items.
            minimum: 0
            maximum: 256
          uniqueItems:
            type: boolean
            description: |
              Whether the array contains only unique items.
          collectionFormat:
            type: string
            description: |
              The format of the array that specifies how you separated array values, either the default `csv` for comma separated values, `ssv` for space separated values, `tsv` for tab separated values, `pipes` for pipe separated values, or `multi` for several parameter instances instead of several values for a single instance.
            default: csv
            enum:
            - csv
            - ssv
            - tsv
            - pipes
            - multi
      xmlConversionRule:
        $ref: xml-restriction-dto.yaml
      responseRestriction:
        type: object
        description: |
          Response restrictions on the status codes and the response body size.
        additionalProperties: false
        properties:
          statusCodes:
            type: array
            description: |
              The response status codes to match to a particular response body format. A `null` or empty value means the response body definition applies to any response body.
            nullable: true
            items:
              type: integer
          maxBodySize:
            type: string
            description: |
              Limit how large the response body can be before tripping the firewall action. The default is `SIZE_6K`. You can choose `SIZE_8K`, `SIZE_12K`, or `NO_LIMIT`, which allows a response of any size.
            enum:
            - SIZE_6K
            - SIZE_8K
            - SIZE_12K
            - NO_LIMIT
  apiChildParameters:
    type: array
    description: |
      Child JSON fields or XML elements for JSON or XML body type parameters.
    items:
      $ref: api-parameter-dto-nested.yaml
  nullable:
    type: boolean
    description: |
      Indicates whether the parameter value can be `null`.
    default: false
    nullable: true
  arrayItemNullable:
    type: boolean
    description: |
      Indicates whether items in an array parameter can be `null`.
    nullable: true
