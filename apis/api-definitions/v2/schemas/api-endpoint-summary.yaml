type: object
description: |
  Collects data about an API endpoint.
additionalProperties: false
required:
- apiEndPointId
- apiEndPointHosts
- apiEndPointName
- basePath
- caseSensitive
- link
properties:
  apiEndPointId:
    type: integer
    description: |
      Identifies the API endpoint.
  apiEndPointHosts:
    type: array
    description: |
      API endpoint hostnames.
    minItems: 1
    items:
      type: string
      description: |
        A hostname used to publish the API through Akamai.
      minLength: 1
  apiEndPointName:
    type: string
    description: |
      The name of the API endpoint.
    minLength: 1
  basePath:
    type: string
    description: |
      The URL path relative to the hostnames on which the resource resides. When entering a resource path, you can use curly brackets (`{}`) to define path parameters (for example, `/path/{pathParam}`). If you decide to do so, ensure that the value of the `apiParameterName` field in the corresponding parameter definition matches the name that you specified in the resource path.
    minLength: 1
  caseSensitive:
    type: boolean
    description: |
      Whether to match on case sensitivity.
  link:
    type: string
    description: |
      The location of the navigable resource within this API, for use by API clients.
    minLength: 1
  productionVersion:
    $ref: activation-status.yaml
  stagingVersion:
    $ref: activation-status.yaml
