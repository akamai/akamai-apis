type: object
description: |
  OAuth scopes assigned to each resource assigned to an endpoint version. The resources are available through a map of `resourceId` keys.
title: The map of resource ID to settings.
additionalProperties: false
properties:
  path:
    type: string
    description: |
      The URL path relative to the hostnames on which the resource resides.
    readOnly: true
  notes:
    type: string
    description: |
      The description of the resource.
    nullable: true
    readOnly: true
  scopes:
    type: array
    description: |
      The scopes that define the level of client apps' access to the resource and its associated methods.
    items:
      type: string
  methods:
    description: |
      OAuth scopes assigned to each method assigned to a resource. The methods are available through a map of `apiResourceMethod` keys.
    $ref: methods-oauth.yaml
