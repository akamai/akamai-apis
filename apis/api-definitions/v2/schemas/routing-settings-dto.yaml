type: object
description: |
  An incoming request's routing settings configured for an endpoint. Routing settings specify routing, forwarding, and SureRoute instructions for an endpoint version. You can configure routing settings if the API Gateway product is in your contract and you're taking part in the API Gateway beta program.
additionalProperties: false
properties:
  rules:
    type: array
    description: |
      Routing Rules.
    items:
      $ref: routing-rule.yaml
  sureRoute:
    type: array
    description: |
      SureRoute definitions.
    items:
      $ref: routing-sure-route.yaml
