type: object
description: |
  GZIP compression settings configured for an endpoint. This feature ensures proper content compression for bandwidth savings. You can configure GZIP compression settings if the API Gateway product is in your contract.
additionalProperties: false
required:
- compressResponse
properties:
  compressResponse:
    type: string
    description: |
      The type of GZIP compression configuration that you select, either `ALWAYS` for compressing all responses without restrictions, `NEVER` for no GZIP compression, or  `SAME_AS_ORIGIN` for the same compression rules as specified for your origin server using the `Content-Encoding` header.
    default: ALWAYS
    enum:
    - ALWAYS
    - NEVER
    - SAME_AS_ORIGIN
