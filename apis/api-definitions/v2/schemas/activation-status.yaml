type: object
description: |
  Collects data about the API endpoint's activation status.
additionalProperties: false
properties:
  versionNumber:
    type: integer
    description: |
      The endpoint's version.
    nullable: true
  status:
    type: string
    description: |
      The activation status, either `PENDING` if the version contains changes that are being propagated, `ACTIVE` if the version is active, `DEACTIVATED` if the version had been active once but has been deactivated, or `FAILED` if an activation or deactivation attempt for this version has failed. The value is `null` for versions that have never been activated.
    nullable: true
    minLength: 1
  timestamp:
    type: string
    description: |
      The ISO 8601 timestamp indicating when the activation status was last updated.
    nullable: true
    minLength: 1
