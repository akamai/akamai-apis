title: Domain Summary v1.2
allOf:
- $ref: domain-summary-vnd-config-gtm.v1.0.yaml
- type: object
  description: |
    Summary information about the domain.
  additionalProperties: true
  properties:
    changeId:
      type: string
      description: |
        The ID associated with the change.
      x-akamai:
        labels:
        - v1.2
    lastModifiedBy:
      type: string
      description: |
        The email address of the administrator who made the last change to the domain.
      x-akamai:
        labels:
        - v1.2
      nullable: true
      readOnly: true
      maxLength: 256
    activationState:
      type: string
      description: |
        Tracks the status of the domain's propagation state. Either `PENDING`, `COMPLETE`, or `DENIED`. A `DENIED` value indicates that the domain configuration is invalid, and doesn't propagate until the validation errors are resolved.
      x-akamai:
        labels:
        - v1.2
      enum:
      - PENDING
      - COMPLETE
      - DENIED
      maxLength: 20
    modificationComments:
      type: string
      description: |
        A descriptive note about changes to the domain. The maximum is 4000 characters.
      x-akamai:
        labels:
        - v1.2
      nullable: true
      maxLength: 4000
