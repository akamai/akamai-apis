type: object
additionalProperties: false
description: |
  The result of a completed bulk domain delete request.
properties:
  requestId:
    type: string
    description: |
      The unique identifier for the delete request.
    minLength: 1
  successfullyDeletedDomains:
    type: array
    description: |
      The list of domain names that were successfully deleted.
    items:
      type: string
  failedDomains:
    type: array
    description: |
      The list of domains that could not be deleted, with reasons.
    items:
      type: object
      additionalProperties: false
      properties:
        domain:
          type: string
          description: |
            The domain name that failed to delete.
          minLength: 1
        failureReason:
          type: string
          description: |
            A code indicating why deletion failed.
          minLength: 1
        failureMessage:
          type: string
          description: |
            A human-readable description of the failure reason.
          nullable: true
