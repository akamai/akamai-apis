type: object
additionalProperties: false
description: |
  A request to asynchronously delete one or more GTM domains.
required:
- domains
properties:
  domains:
    type: array
    description: |
      The list of domain names to delete.
    minItems: 1
    items:
      type: string
      minLength: 1
  comment:
    type: string
    description: |
      An optional comment describing the reason for deletion.
    nullable: true
    maxLength: 1000
