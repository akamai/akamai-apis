type: array
description: |
  Available Akamai cloud regions with geographic metadata.
items:
  type: object
  additionalProperties: false
  properties:
    label:
      type: string
      description: |
        A human-readable label for the Akamai cloud region.
    city:
      type: string
      description: |
        The city where the Akamai cloud region is located.
    stateOrProvince:
      type: string
      nullable: true
      description: |
        The state or province where the Akamai cloud region is located, if applicable.
    country:
      type: string
      description: |
        The two-letter ISO 3166-1 country code where the Akamai cloud region is located.
    countryName:
      type: string
      description: |
        The full name of the country where the Akamai cloud region is located.
    continent:
      type: string
      description: |
        The continent where the Akamai cloud region is located.
    latitude:
      type: number
      format: float
      description: |
        The geographic latitude of the Akamai cloud region.
    longitude:
      type: number
      format: float
      description: |
        The geographic longitude of the Akamai cloud region.
    cloud:
      type: object
      additionalProperties: false
      description: |
        Cloud provider details for this region.
      properties:
        provider:
          type: string
          description: |
            The cloud provider identifier, `akamai-cloud` or `akamai-metal`.
          enum:
          - akamai-cloud
          - akamai-metal
        regionId:
          type: string
          description: |
            The cloud provider's unique identifier for this region.
