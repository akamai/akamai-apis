title: livenessTest v1.5
allOf:
- $ref: liveness-test-v1.4.yaml
- type: object
  description: |
    Liveness tests, which run periodically to determine whether your servers respond to requests, as discussed in [API concepts](ref:api-concepts).
  additionalProperties: true
  properties:
    httpMethod:
      type: string
      description: |
        The HTTP method to send if the `testObjectProtocol` is `http` or `https`. Possible values are: `TRACE`, `HEAD`, `OPTIONS`, `GET`, `PUT`, `POST`, `PATCH`, or `DELETE`. When omitted or `null`, this value defaults to `GET`.
      x-akamai:
        labels:
        - v1.5
      default: GET
      nullable: true
      enum:
      - TRACE
      - HEAD
      - OPTIONS
      - GET
      - PUT
      - POST
      - PATCH
      - DELETE
    httpRequestBody:
      type: string
      description: |
        The Base64-encoded HTTP request body to send if the `testObjectProtocol` is `http` or `https`. When omitted or `null`, omits the request body from the request.
      x-akamai:
        labels:
        - v1.5
      nullable: true
    alternateCACertificates:
      type: array
      description: |
        Alternate trust anchors, Base64-encoded CA certificates. Available for `livenessTests` that use secure protocols.
      x-akamai:
        labels:
        - v1.5
      items:
        type: string
