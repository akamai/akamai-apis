type: object
description: |
  The set of authoritative servers associated with a custom domain.
additionalProperties: false
properties:
  domainName:
    type: string
    description: |
      The domain name for which authorities are defined.
  authorities:
    type: array
    description: |
      Authoritative server hostnames that provide DNS responses for the specified domain.
    items:
      type: string
    minItems: 0
  ttlSeconds:
    type: integer
    description: |
      The recommended time-to-live (TTL), in seconds, for DNS records returned by the authoritative servers.
    default: 86400
  contractId:
    type: string
    description: |
      The contract for this domain.
  status:
    type: string
    enum:
      - DOMAIN_HAS_AUTHORITIES
      - NO_AUTHORITIES
    description: |
      The status of authorities for the domain, either `DOMAIN_HAS_AUTHORITIES` or `NO_AUTHORITIES`.
required:
  - domainName
  - authorities
  - ttlSeconds
  - contractId
  - status