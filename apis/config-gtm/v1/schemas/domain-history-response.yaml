type: object
title: Domain history list
additionalProperties: false
required:
- metadata
- changes
- links
properties:
  metadata:
    type: object
    description: |
      Provides information about the page of data that this response contains.
    additionalProperties: false
    required:
    - lastPage
    - pageSize
    - page
    - uri
    - totalElements
    properties:
      lastPage:
        type: integer
        description: |
          The number of the last page which can be fetched.
      pageSize:
        type: integer
        description: |
          The number of items per page.
        default: 25
      page:
        type: integer
        description: |
          The number of the current page.
        default: 1
      uri:
        type: string
        description: |
          The uri of this response.
      totalElements:
        type: integer
        description: |
          The total number of history items available for the domain.
  changes:
    type: array
    description: |
      The list of changes for a domain.
    items:
      type: object
      additionalProperties: false
      required:
      - domain
      - modificationDate
      - modifiedBy
      - modifiedByClientId
      - modifiedByClientName
      - comments
      - changes
      - domainVersionId
      properties:
        domain:
          type: string
          description: |
            The name of the domain.
        modificationDate:
          type: string
          format: date-time
          description: |
            An ISO 8601 timestamp indicating when the change was made.
        modifiedBy:
          type: string
          description: |
            The name of the user who made the change.
        modifiedByClientId:
          type: string
          description: |
            The ID of the Akamai API client that made the change, if applicable.
          nullable: true
        modifiedByClientName:
          type: string
          description: |
            The name of the Akamai API client that made the change, if applicable.
          nullable: true
        comments:
          type: string
          description: |
            The modification comments that were given as reason for the change.
          nullable: true
        changes:
          type: array
          description: |
            A textual representation of the changes that were made to the domain.
          nullable: true
          items:
            type: string
        domainVersionId:
          type: string
          description: |
            The domainVersionId that was associated with this change.
          nullable: true
  links:
    type: array
    description: |
      A URL path that allows direct navigation to the domain.
    items:
      $ref: link.yaml
