title: livenessTest v1.2
allOf:
- $ref: liveness-test-v1.0.yaml
- type: object
  description: |
    Liveness tests, which run periodically to determine whether your servers respond to requests, as discussed in [API concepts](ref:api-concepts).
  additionalProperties: true
  required:
  - errorPenalty
  - timeoutPenalty
  properties:
    errorPenalty:
      type: number
      description: |
        Specifies the score that's reported if the liveness test encounters an error other than timeout, such as connection refused, and 404. The default value is `75`.
      x-akamai:
        labels:
        - v1.2
      default: 75
      minimum: 0
    timeoutPenalty:
      type: number
      description: |
        Specifies the score reported if the liveness test times out. This is independent of the liveness `testTimeout` value. The default value is `25` seconds.
      x-akamai:
        labels:
        - v1.2
      default: 25
      minimum: 0
