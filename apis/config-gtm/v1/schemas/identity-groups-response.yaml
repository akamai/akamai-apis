type: object
description: |
  Groups under a specific GTM account.
additionalProperties: false
properties:
  groups:
    type: array
    description: |
      Groups under a specific GTM account. For details on how to modify group permissions, see the [Identity Management: User Administration API](https://techdocs.akamai.com/iam-user-admin/reference/api).
    items:
      type: object
      additionalProperties: false
      properties:
        contractIds:
          type: array
          description: |
            Unique identifiers for the contracts associated with the group.
          items:
            type: string
        groupId:
          type: integer
          description: |
            A unique identifier for the group.
        groupName:
          type: string
          description: |
            A descriptive name for the group.
        permissions:
          type: array
          description: |
            Privileges set for the group. Use these privileges to create a domain, modify, or delete any of the `properties` within a specific domain. Any combination of `READ`, `WRITE`, `ADD`, and `ADD_DATACENTER` values.
          items:
            type: string
            enum:
            - READ
            - WRITE
            - ADD
            - ADD_DATACENTER
