type: object
additionalProperties: false
description: |
  Contract features available for a domain.
properties:
  contractId:
    type: string
    description: |
      The contract ID associated with the domain.
  features:
    type: array
    description: |
      The set of property types available under this contract.
    items:
      type: string
  permissions:
    type: array
    description: |
      The set of permissions granted under this contract.
    items:
      type: string
  securityFeatures:
    type: array
    description: |
      The set of security features available under this contract, such as `DNSSEC_SIGN_AND_SERVE`.
    items:
      type: string
