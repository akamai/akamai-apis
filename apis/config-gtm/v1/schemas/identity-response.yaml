type: object
description: |
  High-level information about the API client for a specific GTM account.
additionalProperties: false
properties:
  accountId:
    type: string
    description: |
      A unique API client identity for a specific account, created in [Control Center](https://control.akamai.com/apps/home-page).
  active:
    type: boolean
    description: |
      Enabled if the account is active.
  contracts:
    type: array
    description: |
      Contracts under a specific account.
    items:
      type: object
      additionalProperties: false
      properties:
        contractId:
          type: string
          description: |
            A unique identifier for the contract.
        features:
          type: array
          description: |
            Available property types for a specific domain. Any combination of `FAILOVER`, `RANKED_FAILOVER`, `QTR`, `STATIC`, `ASMAPPING`, `CIDRMAPPING`, `GEOGRAPHIC`, `WEIGHTED_ROUND_ROBIN`, `WEIGHTED_ROUND_ROBIN_LOAD_FEEDBACK`, `WEIGHTED_HASHED`, `PERFORMANCE`, `PERFORMANCE_WITH_LOAD_FEEDBACK`, `PERFORMANCE_WITH_LOAD_FEEDBACK_COMPUTED_TARGETS`, and `PERFORMANCE_WITH_LOAD_FEEDBACK_DOWNLOAD_SCORE` values.
          items:
            type: string
            enum:
            - FAILOVER
            - RANKED_FAILOVER
            - QTR
            - STATIC
            - ASMAPPING
            - CIDRMAPPING
            - GEOGRAPHIC
            - WEIGHTED_ROUND_ROBIN
            - WEIGHTED_ROUND_ROBIN_LOAD_FEEDBACK
            - WEIGHTED_HASHED
            - PERFORMANCE
            - PERFORMANCE_WITH_LOAD_FEEDBACK
            - PERFORMANCE_WITH_LOAD_FEEDBACK_COMPUTED_TARGETS
            - PERFORMANCE_WITH_LOAD_FEEDBACK_DOWNLOAD_SCORE
        permissions:
          type: array
          description: |
            Privileges set for the contract, controlling the ability to modify or delete `properties`. Any combination of `READ`, `WRITE`, `ADD`, and `ADD_DATACENTER` values.
          items:
            type: string
            enum:
            - READ
            - WRITE
            - ADD
            - ADD_DATACENTER
  email:
    type: string
    description: |
      The email address of the client on the account.
  firstName:
    type: string
    description: |
      The first name of the client on the account.
  lastName:
    type: string
    description: |
      The last name of the client on the account.
  locale:
    type: string
    description: |
      Indicates the client's language and country in [RFC 5646](https://tools.ietf.org/html/rfc5646) format.
  userName:
    type: string
    description: |
      The username of the client on the account.
  userTimeZone:
    type: string
    description: |
      The time zone of the client on the account, which specifies an offset from GTM.
