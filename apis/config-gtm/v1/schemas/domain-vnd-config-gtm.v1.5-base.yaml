allOf:
- $ref: domain-vnd-config-gtm.v1.1-base.yaml
- type: object
  description: |
    The basic building block of a traffic management configuration. Each domain object represents a complete GTM domain such as `example.akadns.net`.
  additionalProperties: true
  required:
  - signAndServe
  properties:
    signAndServe:
      type: boolean
      description: |
        Whether DNSSEC Sign&Serve is enabled.
      x-akamai:
        labels:
        - v1.5
      default: false
    signAndServeAlgorithm:
      type: string
      description: |
        The algorithm currently or last used for DNSSEC Sign&Serve. `null` if no algorithm has ever been assigned to this domain. Either `RSA_SHA1`, `RSA_SHA256`, `RSA_SHA512`, `ECDSA_P256_SHA256`, `ECDSA_P384_SHA384`.
      x-akamai:
        labels:
        - v1.5
      nullable: true
      enum:
      - RSA_SHA1
      - RSA_SHA256
      - RSA_SHA512
      - ECDSA_P256_SHA256
      - ECDSA_P384_SHA384
