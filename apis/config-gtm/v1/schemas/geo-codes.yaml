type: object
additionalProperties: false
description: |
  A hierarchical collection of geographic codes used to configure geographic maps.
properties:
  continents:
    type: array
    description: |
      The list of continents and their nested countries and regions.
    items:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          description: |
            The two-letter continent code, for example `NA` for North America.
        name:
          type: string
          description: |
            The full name of the continent.
        countries:
          type: array
          description: |
            The list of countries within this continent.
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                description: |
                  The two-letter ISO country code.
              name:
                type: string
                description: |
                  The full name of the country.
              regions:
                type: array
                description: |
                  The list of states, provinces, or regions within this country.
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: string
                      description: |
                        The region code.
                    name:
                      type: string
                      description: |
                        The full name of the region.
