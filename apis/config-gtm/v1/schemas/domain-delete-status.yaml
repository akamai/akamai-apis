type: object
additionalProperties: false
description: |
  The current status of a bulk domain delete request.
properties:
  requestId:
    type: string
    description: |
      The unique identifier for the delete request.
    minLength: 1
  domainsSubmitted:
    type: integer
    description: |
      The total number of domains included in the delete request.
  successCount:
    type: integer
    description: |
      The number of domains successfully deleted so far.
  failureCount:
    type: integer
    description: |
      The number of domains that failed to delete.
  isComplete:
    type: boolean
    description: |
      Whether all domains in the request have been processed. When `true`, you can retrieve the full result.
  expirationDate:
    type: string
    format: date-time
    description: |
      An ISO 8601 timestamp indicating when the delete request record expires and is no longer available.
