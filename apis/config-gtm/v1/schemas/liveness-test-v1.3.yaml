title: livenessTest v1.3
allOf:
- $ref: liveness-test-v1.2.yaml
- type: object
  description: |
    Liveness tests, which run periodically to determine whether your servers respond to requests, as discussed in [API concepts](ref:api-concepts).
  additionalProperties: true
  required:
  - answersRequired
  - resourceType
  - recursionRequested
  - peerCertificateVerification
  properties:
    answersRequired:
      type: boolean
      description: |
        If `testObjectProtocol` is `DNS`, `DOH` or `DOT`, requires an answer to the DNS query to be considered a success. The default is `false`.
      x-akamai:
        labels:
        - v1.3
      default: false
    peerCertificateVerification:
      type: boolean
      description: |
        Validates the origin certificate. Applies only to tests with `testObjectProtocol` of `https`. The default is `false`.
      x-akamai:
        labels:
        - v1.3
      default: false
    recursionRequested:
      type: boolean
      description: |
        Indicates that if `testObjectProtocol` is `DNS`, `DOH` or `DOT`, the `DNS` query is recursive. The default is `false`.
      x-akamai:
        labels:
        - v1.3
      default: false
    resourceType:
      type: string
      description: |
        Specifies the query type, if `testObjectProtocol` is `DNS`. Types include: `A`, `AAAA`, `AFSDB`, `CNAME`, `HINFO`, `LOC`, `MX`, `NAPTR`, `NS`, `PTR`, `RP`, `SOA`, `SPF`, `SRV`, `SSHFP`, `TXT`, `DNSKEY`, `DS`, `NSEC3`, `NSEC3PARAM`, or `RRSIG`. Additional support for unknown types `TYPENNNNN` where `NNNNN` is an integer from `1` through `65535`.
      x-akamai:
        labels:
        - v1.3
      nullable: true
      enum:
      - A
      - AAAA
      - AFSDB
      - CNAME
      - HINFO
      - LOC
      - MX
      - NAPTR
      - NS
      - PTR
      - RP
      - SOA
      - SPF
      - SRV
      - SSHFP
      - TXT
      - DNSKEY
      - DS
      - NSEC3
      - NSEC3PARAM
      - RRSIG
