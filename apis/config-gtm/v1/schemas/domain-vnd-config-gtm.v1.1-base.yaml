allOf:
- $ref: domain-vnd-config-gtm.v1.0-base.yaml
- type: object
  description: |
    The basic building block of a traffic management configuration. Each domain object represents a complete GTM domain such as `example.akadns.net`.
  additionalProperties: true
  required:
  - asMaps
  - cnameCoalescingEnabled
  properties:
    asMaps:
      type: array
      description: |
        The set of AS maps assigned to this domain.
      x-akamai:
        labels:
        - v1.1
      items:
        $ref: as-map.yaml
    cnameCoalescingEnabled:
      type: boolean
      description: |
        If enabled, GTM collapses CNAME redirections in DNS answers when it knows the target of the CNAME. The default value is `false`.
      x-akamai:
        labels:
        - v1.1
      default: false
