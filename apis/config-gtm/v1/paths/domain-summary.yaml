x-akamai:
  path-info: /domains/{domainName}/summary
parameters:
- $ref: ../parameters/domain-name-path.yaml
get:
  operationId: get-domain-summary
  summary: Get a domain summary
  tags:
  - Domains
  description: |
    Returns summary information for a specific GTM domain, including its activation state, last modification details, and DNSSEC configuration.
  responses:
    200:
      description: |
        Successful response.
      content:
        domain-vnd-config-gtm.v1.0+json:
          example:
            $ref: ../examples/get-a-domain-summary-200.json
          schema:
            $ref: ../schemas/domain-summary-vnd-config-gtm.v1.0.yaml
        domain-vnd-config-gtm.v1.1+json:
          example:
            $ref: ../examples/get-a-domain-summary-200.json
          schema:
            $ref: ../schemas/domain-summary-vnd-config-gtm.v1.1.yaml
