x-akamai:
  path-info: /collections/supported-geo-codes
get:
  operationId: get-supported-geo-codes
  summary: List supported geo codes
  tags:
  - Collections
  description: |
    Returns the full hierarchy of supported geographic codes — continents, countries, and states or provinces — that you can use when configuring geographic maps.
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/list-supported-geo-codes-200.json
          schema:
            $ref: ../schemas/geo-codes.yaml
