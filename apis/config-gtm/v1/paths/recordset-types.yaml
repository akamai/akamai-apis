x-akamai:
  path-info: /data/recordset-types
get:
  operationId: get-recordset-types
  summary: List DNS record set types
  tags:
  - Collections
  description: |
    Returns the DNS record types supported for GTM properties, optionally filtered by domain.
  parameters:
  - name: domain
    in: query
    description: |
      When specified, returns only the record types supported for the given domain name.
    required: false
    schema:
      type: string
      example: example.akadns.net
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/list-recordset-types-200.json
          schema:
            $ref: ../schemas/dns-record-types.yaml
