x-akamai:
  path-info: /domains/{domainName}/authorities
parameters:
  - $ref: ../parameters/domain-name-path.yaml
get:
  operationId: get-domain-authorities
  summary: Get domain authorities
  tags:
    - Domains
  description: |
    Returns authorities for a specific GTM domain if it is a custom domain and not hosted on config-gtm.
  responses:
    200:
      description: |
        Successful response.
      content:
        domain-vnd-config-gtm.v1.0+json:
          example:
            $ref: ../examples/get-a-domain-authorities-200.json
          schema:
            $ref: ../schemas/domain-authorities-vnd-config-gtm.yaml
        domain-vnd-config-gtm.v1.1+json:
          example:
            $ref: ../examples/get-a-domain-authorities-200.json
          schema:
            $ref: ../schemas/domain-authorities-vnd-config-gtm.yaml
        domain-vnd-config-gtm.v1.2+json:
          example:
            $ref: ../examples/get-a-domain-authorities-200.json
          schema:
            $ref: ../schemas/domain-authorities-vnd-config-gtm.yaml
        domain-vnd-config-gtm.v1.3+json:
          example:
            $ref: ../examples/get-a-domain-authorities-200.json
          schema:
            $ref: ../schemas/domain-authorities-vnd-config-gtm.yaml
        domain-vnd-config-gtm.v1.4+json:
          example:
            $ref: ../examples/get-a-domain-authorities-200.json
          schema:
            $ref: ../schemas/domain-authorities-vnd-config-gtm.yaml
        domain-vnd-config-gtm.v1.5+json:
          example:
            $ref: ../examples/get-a-domain-authorities-200.json
          schema:
            $ref: ../schemas/domain-authorities-vnd-config-gtm.yaml
        domain-vnd-config-gtm.v1.6+json:
          example:
            $ref: ../examples/get-a-domain-authorities-200.json
          schema:
            $ref: ../schemas/domain-authorities-vnd-config-gtm.yaml
        domain-vnd-config-gtm.v1.7+json:
          example:
            $ref: ../examples/get-a-domain-authorities-200.json
          schema:
            $ref: ../schemas/domain-authorities-vnd-config-gtm.yaml
        domain-vnd-config-gtm.v1.8+json:
          example:
            $ref: ../examples/get-a-domain-authorities-200.json
          schema:
            $ref: ../schemas/domain-authorities-vnd-config-gtm.yaml
