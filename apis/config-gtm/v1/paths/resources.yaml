x-akamai:
  path-info: /domains/{domainName}/resources
parameters:
- $ref: ../parameters/domain-name-path.yaml
get:
  operationId: get-resources
  summary: List resources
  tags:
  - Resources
  description: |
    Returns a list of resources created within the domain that constrain one or more properties in a data center.
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/list-resources-200.json
          schema:
            $ref: "../schemas/get-all-resources.yaml"
