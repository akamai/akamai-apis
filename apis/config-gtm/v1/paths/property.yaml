x-akamai:
  path-info: /domains/{domainName}/properties/{propertyName}
parameters:
- $ref: ../parameters/property-name-path.yaml
- $ref: ../parameters/domain-name-path.yaml
get:
  operationId: get-property
  summary: Get a property
  tags:
  - Properties
  description: |
    Returns information for a specific GTM property.
  responses:
    200:
      description: |
        Successful response.
      content:
        application/property-vnd-config-gtm.v1.0+json:
          example:
            $ref: ../examples/get-a-property-200.json
          schema:
            $ref: ../schemas/property-vnd-config-gtm.v1.0.yaml
        application/property-vnd-config-gtm.v1.1+json:
          example:
            $ref: ../examples/property-vnd-config-gtm.v1.1.json
          schema:
            $ref: ../schemas/property-vnd-config-gtm.v1.1.yaml
        application/property-vnd-config-gtm.v1.2+json:
          example:
            $ref: ../examples/property-vnd-config-gtm.v1.2.json
          schema:
            $ref: ../schemas/property-vnd-config-gtm.v1.2.yaml
        application/property-vnd-config-gtm.v1.3+json:
          example:
            $ref: ../examples/property-vnd-config-gtm.v1.3.json
          schema:
            $ref: ../schemas/property-vnd-config-gtm.v1.3.yaml
        application/property-vnd-config-gtm.v1.4+json:
          example:
            $ref: ../examples/property-vnd-config-gtm.v1.4.json
          schema:
            $ref: ../schemas/property-vnd-config-gtm.v1.4.yaml
        application/property-vnd-config-gtm.v1.5+json:
          example:
            $ref: ../examples/property-vnd-config-gtm.v1.5.json
          schema:
            $ref: ../schemas/property-vnd-config-gtm.v1.5.yaml
        application/property-vnd-config-gtm.v1.6+json:
          example:
            $ref: ../examples/property-vnd-config-gtm.v1.6.json
          schema:
            $ref: ../schemas/property-vnd-config-gtm.v1.6.yaml
put:
  operationId: put-property
  summary: Create or update a property
  tags:
  - Properties
  description: |
    Run this operation to create or update a GTM property.
  parameters:
  - $ref: ../parameters/domain-modification-comments-query.yaml
  requestBody:
    required: true
    content:
      application/property-vnd-config-gtm.v1.0+json:
        example:
          $ref: ../examples/create-or-update-a-property.json
        schema:
          $ref: ../schemas/property-vnd-config-gtm.v1.0.yaml
      application/property-vnd-config-gtm.v1.1+json:
        example:
          $ref: ../examples/property-vnd-config-gtm.v1.1.json
        schema:
          $ref: ../schemas/property-vnd-config-gtm.v1.1.yaml
      application/property-vnd-config-gtm.v1.2+json:
        example:
          $ref: ../examples/property-vnd-config-gtm.v1.2.json
        schema:
          $ref: ../schemas/property-vnd-config-gtm.v1.2.yaml
      application/property-vnd-config-gtm.v1.3+json:
        example:
          $ref: ../examples/property-vnd-config-gtm.v1.3.json
        schema:
          $ref: ../schemas/property-vnd-config-gtm.v1.3.yaml
      application/property-vnd-config-gtm.v1.4+json:
        example:
          $ref: ../examples/property-vnd-config-gtm.v1.4.json
        schema:
          $ref: ../schemas/property-vnd-config-gtm.v1.4.yaml
      application/property-vnd-config-gtm.v1.5+json:
        example:
          $ref: ../examples/property-vnd-config-gtm.v1.5.json
        schema:
          $ref: ../schemas/property-vnd-config-gtm.v1.5.yaml
      application/property-vnd-config-gtm.v1.6+json:
        example:
          $ref: ../examples/property-vnd-config-gtm.v1.6.json
        schema:
          $ref: ../schemas/property-vnd-config-gtm.v1.6.yaml
  responses:
    201:
      description: |
        Successful response.
      content:
        application/property-vnd-config-gtm.v1.0+json:
          example:
            $ref: ../examples/create-or-update-a-property-200.json
          schema:
            $ref: ../schemas/update-property-response-v1.0.yaml
        application/property-vnd-config-gtm.v1.1+json:
          example:
            $ref: ../examples/update-property-vnd-config-gtm-201.v1.1.json
          schema:
            $ref: ../schemas/update-property-response-v1.1.yaml
        application/property-vnd-config-gtm.v1.2+json:
          example:
            $ref: ../examples/update-property-vnd-config-gtm-201.v1.2.json
          schema:
            $ref: ../schemas/update-property-response-v1.2.yaml
        application/property-vnd-config-gtm.v1.3+json:
          example:
            $ref: ../examples/update-property-vnd-config-gtm-201.v1.3.json
          schema:
            $ref: ../schemas/update-property-response-v1.3.yaml
        application/property-vnd-config-gtm.v1.4+json:
          example:
            $ref: ../examples/update-property-vnd-config-gtm-201.v1.4.json
          schema:
            $ref: ../schemas/update-property-response-v1.4.yaml
        application/property-vnd-config-gtm.v1.5+json:
          example:
            $ref: ../examples/update-property-vnd-config-gtm-201.v1.5.json
          schema:
            $ref: ../schemas/update-property-response-v1.5.yaml
        application/property-vnd-config-gtm.v1.6+json:
          example:
            $ref: ../examples/update-property-vnd-config-gtm-201.v1.6.json
          schema:
            $ref: ../schemas/update-property-response-v1.6.yaml
delete:
  operationId: delete-property
  summary: Remove a property
  tags:
  - Properties
  description: |
    Removes a specific GTM property.
  responses:
    200:
      description: |
        Successful response.
      content:
        application/property-vnd-config-gtm.v1.0+json:
          example:
            $ref: ../examples/remove-a-property-200.json
          schema:
            $ref: ../schemas/update-property-response-v1.0.yaml
        application/property-vnd-config-gtm.v1.1+json:
          example:
            $ref: ../examples/remove-a-property-200.json
          schema:
            $ref: ../schemas/update-property-response-v1.1.yaml
        application/property-vnd-config-gtm.v1.2+json:
          example:
            $ref: ../examples/remove-a-property-200.json
          schema:
            $ref: ../schemas/update-property-response-v1.2.yaml
        application/property-vnd-config-gtm.v1.3+json:
          example:
            $ref: ../examples/remove-a-property-200.json
          schema:
            $ref: ../schemas/update-property-response-v1.3.yaml
        application/property-vnd-config-gtm.v1.4+json:
          example:
            $ref: ../examples/remove-a-property-200.json
          schema:
            $ref: ../schemas/update-property-response-v1.4.yaml
