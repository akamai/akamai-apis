  - $ref: ../parameters/gid-query.yaml
  requestBody:
    required: true
    content:
      domain-vnd-config-gtm.v1.0+json:
        example:
          $ref: ../examples/create-or-update-a-domain-v1.0.json
        schema:
          $ref: ../schemas/domain-vnd-config-gtm.v1.0.yaml
      domain-vnd-config-gtm.v1.1+json:
        example:
          $ref: ../examples/create-or-update-a-domain-v1.1.json
        schema:
          $ref: ../schemas/domain-vnd-config-gtm.v1.1.yaml
      domain-vnd-config-gtm.v1.2+json:
        example:
          $ref: ../examples/create-or-update-a-domain-v1.2.json
        schema:
          $ref: ../schemas/domain-vnd-config-gtm.v1.2.yaml
      domain-vnd-config-gtm.v1.3+json:
        example:
          $ref: ../examples/create-or-update-a-domain-v1.3.json
        schema:
          $ref: ../schemas/domain-vnd-config-gtm.v1.3.yaml
      domain-vnd-config-gtm.v1.4+json:
        example:
          $ref: ../examples/create-or-update-a-domain-v1.4.json
        schema:
          $ref: ../schemas/domain-vnd-config-gtm.v1.4.yaml
      domain-vnd-config-gtm.v1.5+json:
        example:
          $ref: ../examples/create-or-update-a-domain-v1.5.json
        schema:
          $ref: ../schemas/domain-vnd-config-gtm.v1.5.yaml
      domain-vnd-config-gtm.v1.6+json:
        example:
          $ref: ../examples/create-or-update-a-domain-v1.6.json
        schema:
          $ref: ../schemas/domain-vnd-config-gtm.v1.6.yaml
      domain-vnd-config-gtm.v1.7+json:
        example:
          $ref: ../examples/create-or-update-a-domain-v1.7.json
        schema:
          $ref: ../schemas/domain-vnd-config-gtm.v1.7.yaml
      domain-vnd-config-gtm.v1.8+json:
        example:
          $ref: ../examples/create-or-update-a-domain-v1.8.json
        schema:
          $ref: ../schemas/domain-vnd-config-gtm.v1.8.yaml
  responses:
    201:
      description: |
        The domain was created successfully.
      headers:
        Location:
          schema:
            type: string
      content:
        domain-vnd-config-gtm.v1.0+json:
          example:
            $ref: ../examples/create-or-update-a-domain-200-v1.0.json
          schema:
            $ref: ../schemas/update-domain-response-v1.0.yaml
        domain-vnd-config-gtm.v1.1+json:
          example:
            $ref: ../examples/create-or-update-a-domain-200-v1.1.json
          schema:
