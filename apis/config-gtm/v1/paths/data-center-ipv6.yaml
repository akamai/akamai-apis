x-akamai:
  path-info: /domains/{domainName}/datacenters/datacenter-for-ip-version-selector-ipv6
parameters:
- $ref: ../parameters/domain-name-path.yaml
post:
  operationId: post-datacenter-for-ipv6
  summary: Create an IPv6 data center for ip-version-selector
  tags:
  - Data centers
  description: |
    This operation creates a data center which is solely reserved for use by properties of type `qtr` (IP Version Selector). The data center created by this resource  is assigned the `datacenterId` 5402, which is interpreted as the target for `AAAA` record requests.
  responses:
    201:
      description: |
        Successful response.
      headers:
        Location:
          schema:
            type: string
      content:
        datacenter-vnd-config-gtm.v1.0+json:
          example:
            $ref: ../examples/create-a-datacenter-for-ip-version-selector-ipv6-201.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.0.yaml
        datacenter-vnd-config-gtm.v1.1+json:
          example:
            $ref: ../examples/create-a-datacenter-for-ip-version-selector-ipv6-201.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.1.yaml
        datacenter-vnd-config-gtm.v1.2+json:
          example:
            $ref: ../examples/create-a-datacenter-for-ip-version-selector-ipv6-201.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.2.yaml
        datacenter-vnd-config-gtm.v1.3+json:
          example:
            $ref: ../examples/create-a-datacenter-for-ip-version-selector-ipv6-201-v1.3.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.3.yaml
        datacenter-vnd-config-gtm.v1.4+json:
          example:
            $ref: ../examples/create-a-datacenter-for-ip-version-selector-ipv6-201-v1.3.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.4.yaml
        datacenter-vnd-config-gtm.v1.5+json:
          example:
            $ref: ../examples/create-a-datacenter-for-ip-version-selector-ipv6-201-v1.3.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.5.yaml
        datacenter-vnd-config-gtm.v1.6+json:
          example:
            $ref: ../examples/create-a-datacenter-for-ip-version-selector-ipv6-201-v1.3.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.6.yaml
        datacenter-vnd-config-gtm.v1.7+json:
          example:
            $ref: ../examples/create-a-datacenter-for-ip-version-selector-ipv6-201-v1.7.json
          schema:
