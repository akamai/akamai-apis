x-akamai:
  path-info: /domains/delete-requests/{requestId}/result
parameters:
- $ref: ../parameters/domain-delete-request-id-path.yaml
get:
  operationId: get-domain-delete-request-result
  summary: Get delete request result
  tags:
  - Domains
  description: |
    Returns the final result of a completed bulk domain delete request, listing which domains were successfully deleted and which failed. Only available once `isComplete` is `true` in the status endpoint.
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/get-domain-delete-result-200.json
          schema:
            $ref: ../schemas/domain-delete-result.yaml
