x-akamai:
  path-info: /domains/delete-requests
post:
  operationId: post-domain-delete-requests
  summary: Submit a bulk domain delete request
  tags:
  - Domains
  description: |
    Submits an asynchronous request to delete one or more GTM domains. Poll the returned `requestId` using the status endpoint to track progress.
  parameters:
  - $ref: ../parameters/bypass-safety-checks-query.yaml
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/submit-domain-delete-request.json
        schema:
          $ref: ../schemas/domain-delete-request.yaml
  responses:
    202:
      description: |
        The delete request was accepted and is being processed.
      content:
        application/json:
          example:
            $ref: ../examples/submit-domain-delete-request-202.json
          schema:
            $ref: ../schemas/domain-delete-submit-response.yaml
