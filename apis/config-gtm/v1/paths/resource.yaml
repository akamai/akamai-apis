x-akamai:
  path-info: /domains/{domainName}/resources/{resourceName}
parameters:
- $ref: ../parameters/resource-name-path.yaml
- $ref: ../parameters/domain-name-path.yaml
get:
  operationId: get-resource
  summary: Get a resource
  tags:
  - Resources
  description: |
    Returns information for a specific resource.
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/get-a-resource-200.json
          schema:
            $ref: ../schemas/resource.yaml
put:
  operationId: put-resource
  summary: Create or update a resource
  tags:
  - Resources
  description: |
    Run this operation to create or update a resource.
  parameters:
  - $ref: ../parameters/domain-modification-comments-query.yaml
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/create-or-update-a-resource.json
        schema:
          $ref: ../schemas/resource.yaml
  responses:
    200:
      description: |
        The resource was updated successfully.
      content:
        application/json:
          example:
            $ref: ../examples/create-or-update-a-resource-200.json
          schema:
            $ref: "../schemas/update-resource-response.yaml"
    201:
      description: |
        The resource was created successfully.
      headers:
        Location:
          schema:
            type: string
      content:
        application/json:
          example:
            $ref: ../examples/create-or-update-a-resource-200.json
          schema:
            $ref: "../schemas/update-resource-response.yaml"
delete:
  operationId: delete-resource
  summary: Remove a resource
  tags:
  - Resources
  description: |
    Removes a specific resource.
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/remove-a-resource-200.json
          schema:
            $ref: "../schemas/delete-response.yaml"
