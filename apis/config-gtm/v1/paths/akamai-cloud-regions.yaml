x-akamai:
  path-info: /collections/akamai-cloud-regions
get:
  operationId: get-akamai-cloud-regions
  summary: List Akamai cloud regions
  tags:
  - Collections
  description: |
    This operation returns a list of available Akamai cloud regions. Use these regions when creating a data center with a `cloudProvider` of `akamai-cloud`. Each region includes geographic metadata such as city, country, latitude, and longitude that you can use to populate data center fields.
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/list-akamai-cloud-regions-200.json
          schema:
            $ref: ../schemas/akamai-cloud-regions.yaml
