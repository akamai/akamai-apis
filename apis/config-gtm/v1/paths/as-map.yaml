x-akamai:
  path-info: /domains/{domainName}/as-maps/{mapName}
parameters:
- $ref: ../parameters/map-name-path.yaml
- $ref: ../parameters/domain-name-path.yaml
get:
  operationId: get-as-map
  summary: Get an AS map
  tags:
  - AS maps
  description: |
    Returns information for a specific AS map.
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/get-an-as-map-200.json
          schema:
            $ref: ../schemas/as-map.yaml
put:
  operationId: put-as-map
  summary: Create or update an AS map
  tags:
  - AS maps
  description: |
    Run this operation to create or update an AS map.
  parameters:
  - $ref: ../parameters/domain-modification-comments-query.yaml
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/get-an-as-map-200.json
        schema:
          $ref: ../schemas/as-map.yaml
  responses:
    200:
      description: |
        The AS map was updated successfully.
      content:
        application/json:
          example:
            $ref: ../examples/create-or-update-an-as-map.json
          schema:
            $ref: "../schemas/update-as-map-response.yaml"
    201:
      description: |
        The AS map was created successfully.
      headers:
        Location:
          schema:
            type: string
      content:
        application/json:
          example:
            $ref: ../examples/create-or-update-an-as-map.json
          schema:
            $ref: "../schemas/update-as-map-response.yaml"
delete:
  operationId: delete-as-map
  summary: Remove an AS map
  tags:
  - AS maps
  description: |
    Removes a specific AS map.
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/remove-an-as-map-200.json
          schema:
            $ref: "../schemas/delete-response.yaml"
