x-akamai:
  path-info: /collections/datacenter-ids
get:
  operationId: get-datacenter-ids
  summary: List datacenter IDs
  tags:
  - Collections
  description: |
    Returns a paginated list of valid datacenter IDs available for use as virtual datacenters.
  parameters:
  - name: pageSize
    in: query
    description: |
      The maximum number of datacenter IDs to return per page. Defaults to `209`.
    required: false
    schema:
      type: integer
      default: 209
      example: 209
  - name: offset
    in: query
    description: |
      The zero-based index of the first datacenter ID to return. Defaults to `0`.
    required: false
    schema:
      type: integer
      default: 0
      example: 0
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/list-datacenter-ids-200.json
          schema:
            $ref: ../schemas/datacenter-ids.yaml
