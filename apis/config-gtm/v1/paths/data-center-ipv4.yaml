x-akamai:
  path-info: /domains/{domainName}/datacenters/datacenter-for-ip-version-selector-ipv4
parameters:
- $ref: ../parameters/domain-name-path.yaml
post:
  operationId: post-datacenter-for-ipv
  summary: Create an IPv4 data center for ip-version-selector
  tags:
  - Data centers
  description: |
    This operation creates a data center which is solely reserved for use by properties of the IP Version Selector type `qtr`. The data center created by this resource  is assigned the `datacenterId` 5401, which is interpreted as the target for `A` record requests.
  responses:
    201:
      description: |
        Successful response.
      headers:
        Location:
          schema:
            type: string
      content:
        datacenter-vnd-config-gtm.v1.0+json:
          example:
            $ref: ../examples/create-a-datacenter-for-ip-version-selector-ipv4-201.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.0.yaml
        datacenter-vnd-config-gtm.v1.1+json:
          example:
            $ref: ../examples/create-a-datacenter-for-ip-version-selector-ipv4-201.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.1.yaml
        datacenter-vnd-config-gtm.v1.2+json:
          example:
            $ref: ../examples/create-a-datacenter-for-ip-version-selector-ipv4-201.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.2.yaml
        datacenter-vnd-config-gtm.v1.3+json:
          example:
            $ref: ../examples/create-a-datacenter-for-ip-version-selector-ipv4-201-v1.3.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.3.yaml
        datacenter-vnd-config-gtm.v1.4+json:
          example:
            $ref: ../examples/create-a-datacenter-for-ip-version-selector-ipv4-201-v1.3.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.4.yaml
        datacenter-vnd-config-gtm.v1.5+json:
          example:
            $ref: ../examples/create-a-datacenter-for-ip-version-selector-ipv4-201-v1.3.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.5.yaml
        datacenter-vnd-config-gtm.v1.6+json:
          example:
            $ref: ../examples/create-a-datacenter-for-ip-version-selector-ipv4-201-v1.3.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.6.yaml
        datacenter-vnd-config-gtm.v1.7+json:
          example:
            $ref: ../examples/create-a-datacenter-for-ip-version-selector-ipv4-201-v1.7.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.7.yaml
        datacenter-vnd-config-gtm.v1.8+json:
