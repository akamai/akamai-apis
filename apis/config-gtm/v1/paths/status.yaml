x-akamai:
  path-info: /domains/{domainName}/status/{versionId}
parameters:
- $ref: ../parameters/domain-name-path.yaml
- $ref: ../parameters/version-id-path.yaml
get:
  operationId: get-status
  summary: Get status for a domain version
  tags:
  - Domains
  description: |
    Returns the propagation status for a specific domain version, identified by its `changeId`.
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/get-status-200.json
          schema:
            $ref: ../schemas/status-response.yaml
