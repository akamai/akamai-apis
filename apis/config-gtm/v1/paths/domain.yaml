          schema:
            $ref: ../schemas/update-domain-response-v1.1.yaml
        domain-vnd-config-gtm.v1.2+json:
          example:
            $ref: ../examples/create-or-update-a-domain-200-v1.2.json
          schema:
            $ref: ../schemas/update-domain-response-v1.2.yaml
        domain-vnd-config-gtm.v1.3+json:
          example:
            $ref: ../examples/create-or-update-a-domain-200-v1.3.json
          schema:
