        schema:
          $ref: ../schemas/get-all-properties-v1.6.yaml
      application/property-vnd-config-gtm.v1.7+json:
        example:
          $ref: ../examples/list-properties-v1.7-200.json
        schema:
          $ref: ../schemas/get-all-properties-v1.7.yaml
      application/property-vnd-config-gtm.v1.8+json:
        example:
          $ref: ../examples/list-properties-v1.8-200.json
        schema:
          $ref: ../schemas/get-all-properties-v1.8.yaml
  responses:
    200:
      description: |
        Properties added or updated successfully.
      content:
