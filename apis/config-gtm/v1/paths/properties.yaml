        schema:
          $ref: ../schemas/get-all-properties-v1.4.yaml
      application/property-vnd-config-gtm.v1.5+json:
        example:
          $ref: ../examples/list-properties-v1.5-200.json
        schema:
          $ref: ../schemas/get-all-properties-v1.5.yaml
      application/property-vnd-config-gtm.v1.6+json:
        example:
