get:
  operationId: get-properties
  summary: List properties
  tags:
  - Properties
  description: |
    Returns a list of GTM properties.
  responses:
    200:
      description: |
        Successful response.
      content:
        application/property-vnd-config-gtm.v1.0+json:
          example:
            $ref: ../examples/list-properties-200.json
          schema:
            $ref: ../schemas/get-all-properties.yaml
        application/property-vnd-config-gtm.v1.1+json:
          example:
            $ref: ../examples/list-properties-v1.1-200.json
          schema:
            $ref: ../schemas/get-all-properties-v1.1.yaml
        application/property-vnd-config-gtm.v1.2+json:
          example:
            $ref: ../examples/list-properties-v1.2-200.json
          schema:
            $ref: ../schemas/get-all-properties-v1.2.yaml
        application/property-vnd-config-gtm.v1.3+json:
          example:
            $ref: ../examples/list-properties-v1.3-200.json
          schema:
            $ref: ../schemas/get-all-properties-v1.3.yaml
        application/property-vnd-config-gtm.v1.4+json:
          example:
            $ref: ../examples/list-properties-v1.4-200.json
          schema:
            $ref: ../schemas/get-all-properties-v1.4.yaml
        application/property-vnd-config-gtm.v1.5+json:
          example:
            $ref: ../examples/list-properties-v1.5-200.json
          schema:
            $ref: ../schemas/get-all-properties-v1.5.yaml
        application/property-vnd-config-gtm.v1.6+json:
          example:
            $ref: ../examples/list-properties-v1.6-200.json
          schema:
            $ref: ../schemas/get-all-properties-v1.6.yaml
        application/property-vnd-config-gtm.v1.7+json:
          example:
            $ref: ../examples/list-properties-v1.7-200.json
          schema:
            $ref: ../schemas/get-all-properties-v1.7.yaml
        application/property-vnd-config-gtm.v1.8+json:
          example:
            $ref: ../examples/list-properties-v1.8-200.json
          schema:
            $ref: ../schemas/get-all-properties-v1.8.yaml
put:
  operationId: put-properties
  summary: Replace all properties
  tags:
  - Properties
  description: |
    Replaces the complete set of properties on a domain with those specified in the request body.
  parameters:
  - $ref: ../parameters/domain-modification-comments-query.yaml
  requestBody:
    required: true
    content:
      application/property-vnd-config-gtm.v1.0+json:
        example:
          $ref: ../examples/list-properties-200.json
        schema:
          $ref: ../schemas/get-all-properties.yaml
      application/property-vnd-config-gtm.v1.1+json:
        example:
          $ref: ../examples/list-properties-v1.1-200.json
        schema:
          $ref: ../schemas/get-all-properties-v1.1.yaml
      application/property-vnd-config-gtm.v1.2+json:
        example:
          $ref: ../examples/list-properties-v1.2-200.json
        schema:
          $ref: ../schemas/get-all-properties-v1.2.yaml
      application/property-vnd-config-gtm.v1.3+json:
        example:
          $ref: ../examples/list-properties-v1.3-200.json
        schema:
          $ref: ../schemas/get-all-properties-v1.3.yaml
      application/property-vnd-config-gtm.v1.4+json:
        example:
          $ref: ../examples/list-properties-v1.4-200.json
        schema:
          $ref: ../schemas/get-all-properties-v1.4.yaml
      application/property-vnd-config-gtm.v1.5+json:
        example:
          $ref: ../examples/list-properties-v1.5-200.json
        schema:
          $ref: ../schemas/get-all-properties-v1.5.yaml
      application/property-vnd-config-gtm.v1.6+json:
        example:
          $ref: ../examples/list-properties-v1.6-200.json
        schema:
          $ref: ../schemas/get-all-properties-v1.6.yaml
      application/property-vnd-config-gtm.v1.7+json:
        example:
          $ref: ../examples/list-properties-v1.7-200.json
        schema:
          $ref: ../schemas/get-all-properties-v1.7.yaml
      application/property-vnd-config-gtm.v1.8+json:
        example:
          $ref: ../examples/list-properties-v1.8-200.json
        schema:
          $ref: ../schemas/get-all-properties-v1.8.yaml
  responses:
    200:
      description: |
        Properties replaced successfully.
      content:
        application/property-vnd-config-gtm.v1.0+json:
          example:
            $ref: ../examples/replace-properties-200.json
          schema:
            $ref: ../schemas/update-properties-response-v1.0.yaml
        application/property-vnd-config-gtm.v1.1+json:
          example:
            $ref: ../examples/replace-properties-200.json
          schema:
            $ref: ../schemas/update-properties-response-v1.1.yaml
        application/property-vnd-config-gtm.v1.2+json:
          example:
            $ref: ../examples/replace-properties-200.json
          schema:
            $ref: ../schemas/update-properties-response-v1.2.yaml
        application/property-vnd-config-gtm.v1.3+json:
          example:
            $ref: ../examples/replace-properties-200.json
          schema:
            $ref: ../schemas/update-properties-response-v1.3.yaml
        application/property-vnd-config-gtm.v1.4+json:
          example:
            $ref: ../examples/replace-properties-200.json
          schema:
            $ref: ../schemas/update-properties-response-v1.4.yaml
        application/property-vnd-config-gtm.v1.5+json:
          example:
            $ref: ../examples/replace-properties-200.json
          schema:
            $ref: ../schemas/update-properties-response-v1.5.yaml
        application/property-vnd-config-gtm.v1.6+json:
          example:
