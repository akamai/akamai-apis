patch:
  operationId: patch-properties
  summary: Add or update properties
  tags:
  - Properties
  description: |
    Adds or updates properties on a domain without replacing the entire set. Properties not included in the request body are left unchanged.
  parameters:
  - $ref: ../parameters/domain-modification-comments-query.yaml
  requestBody:
    required: true
    content:
      application/property-vnd-config-gtm.v1.0+json:
        example:
          $ref: ../examples/list-properties-200.json
        schema:
          $ref: ../schemas/get-all-properties.yaml
      application/property-vnd-config-gtm.v1.1+json:
