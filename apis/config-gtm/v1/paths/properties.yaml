x-akamai:
  path-info: /domains/{domainName}/properties
parameters:
- $ref: ../parameters/domain-name-path.yaml
get:
  operationId: get-properties
  summary: List properties
  tags:
  - Properties
  description: |
    Returns a list of GTM properties.
  responses:
    200:
      description: |
        Successful response.
      content:
        application/property-vnd-config-gtm.v1.0+json:
          example:
            $ref: ../examples/list-properties-200.json
          schema:
            $ref: ../schemas/get-all-properties.yaml
        application/property-vnd-config-gtm.v1.1+json:
          example:
            $ref: ../examples/list-properties-v1.1-200.json
          schema:
            $ref: ../schemas/get-all-properties-v1.1.yaml
        application/property-vnd-config-gtm.v1.2+json:
          example:
            $ref: ../examples/list-properties-v1.2-200.json
          schema:
            $ref: ../schemas/get-all-properties-v1.2.yaml
        application/property-vnd-config-gtm.v1.3+json:
          example:
            $ref: ../examples/list-properties-v1.3-200.json
          schema:
            $ref: ../schemas/get-all-properties-v1.3.yaml
        application/property-vnd-config-gtm.v1.4+json:
          example:
            $ref: ../examples/list-properties-v1.4-200.json
          schema:
            $ref: ../schemas/get-all-properties-v1.4.yaml
        application/property-vnd-config-gtm.v1.5+json:
          example:
            $ref: ../examples/list-properties-v1.5-200.json
          schema:
            $ref: ../schemas/get-all-properties-v1.5.yaml
        application/property-vnd-config-gtm.v1.6+json:
          example:
            $ref: ../examples/list-properties-v1.6-200.json
          schema:
            $ref: ../schemas/get-all-properties-v1.6.yaml
