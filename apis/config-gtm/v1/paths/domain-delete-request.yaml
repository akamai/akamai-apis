x-akamai:
  path-info: /domains/delete-requests/{requestId}
parameters:
- $ref: ../parameters/domain-delete-request-id-path.yaml
get:
  operationId: get-domain-delete-request
  summary: Get delete request status
  tags:
  - Domains
  description: |
    Returns the current status of a bulk domain delete request, including how many domains have been successfully deleted, failed, and whether processing is complete.
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/get-domain-delete-status-200.json
          schema:
            $ref: ../schemas/domain-delete-status.yaml
