x-akamai:
  path-info: /domains/{domainName}/datacenters/default-datacenter-for-maps
parameters:
- $ref: ../parameters/domain-name-path.yaml
post:
  operationId: post-default-datacenter-for-maps
  summary: Create a default data center
  tags:
  - Data centers
  description: |
    This operation creates a data center for use by the map-type properties CIDR, Geographic or AS mapping as the default data center.
  responses:
    201:
      description: |
        Successful response.
      headers:
        Location:
          schema:
            type: string
      content:
        datacenter-vnd-config-gtm.v1.0+json:
          example:
            $ref: ../examples/create-a-default-data-center-201.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.0.yaml
        datacenter-vnd-config-gtm.v1.1+json:
          example:
            $ref: ../examples/create-a-default-data-center-201.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.1.yaml
        datacenter-vnd-config-gtm.v1.2+json:
          example:
            $ref: ../examples/create-a-default-data-center-201.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.2.yaml
        datacenter-vnd-config-gtm.v1.3+json:
          example:
            $ref: ../examples/create-a-default-data-center-201-v1.3.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.3.yaml
        datacenter-vnd-config-gtm.v1.4+json:
          example:
            $ref: ../examples/create-a-default-data-center-201-v1.3.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.4.yaml
        datacenter-vnd-config-gtm.v1.5+json:
          example:
            $ref: ../examples/create-a-default-data-center-201-v1.3.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.5.yaml
        datacenter-vnd-config-gtm.v1.6+json:
          example:
            $ref: ../examples/create-a-default-data-center-201-v1.3.json
          schema:
            $ref: ../schemas/update-datacenter-response-v1.6.yaml
