x-akamai:
  path-info: /domains/{domainName}/features
parameters:
- $ref: ../parameters/domain-name-path.yaml
get:
  operationId: get-domain-features
  summary: Get domain features
  tags:
  - Domains
  description: |
    Returns the contract features available for a specific GTM domain, including the set of supported property types and security features such as DNSSEC.
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/get-domain-features-200.json
          schema:
            $ref: ../schemas/domain-features.yaml
