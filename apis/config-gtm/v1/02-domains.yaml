openapi: 3.0.0
info:
  title: Domains
  version: v1
servers:
- url: https://{hostname}/config-gtm/v1
x-akamai:
  auth-type: EDGE_GRID
paths:
  /domains:
    $ref: paths/domains.yaml
  /domains/delete-requests:
    $ref: paths/domain-delete-requests.yaml
  /domains/delete-requests/{requestId}:
    $ref: paths/domain-delete-request.yaml
  /domains/delete-requests/{requestId}/result:
    $ref: paths/domain-delete-request-result.yaml
  /domains/{domainName}:
    $ref: paths/domain.yaml
  /domains/{domainName}/authorities:
    $ref: paths/domain-authorities.yaml
  /domains/{domainName}/features:
    $ref: paths/domain-features.yaml
  /domains/{domainName}/history:
    $ref: paths/history.yaml
  /domains/{domainName}/summary:
    $ref: paths/domain-summary.yaml
