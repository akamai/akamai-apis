x-akamai:
  path-info: /rate-limit-status/{purge-type}
parameters:
- $ref: ../parameters/purge-type.yaml
post:
  operationId: post-rate-limit-status
  summary: Check rate and object limit statuses
  tags:
  - Rate limits
  description: |
    The Fast Purge API uses a token bucket model for [rate limiting](ref:rate-limiting) to protect itself from inadvertent or malicious overuse. For each Akamai account, there's a rate limit shared by all object types (CP codes, cache tags, and URL/ARLs), and three separate resource limits for each object type. Each purge request uses one rate limit token from the requests bucket. Each purge object in a request takes up a token from the resource bucket.
    This operation fetches information on the remaining number of requests and objects for a specific account. You can use these details to monitor the request consumption or throttle requests to prevent exceeding the limits, which results in the [429](ref:429) error.
  x-akamai:
    supports-account-switch-key: false
  responses:
    201:
      description: |
        Successful POST of a rate limit status request.
      headers:
        X-Ratelimit-Limit:
          $ref: ../headers/x-ratelimit-limit.yaml
        X-Ratelimit-Limit-Objects:
          $ref: ../headers/x-ratelimit-limit-objects.yaml
        X-Ratelimit-Limit-Per-Second:
          $ref: ../headers/x-ratelimit-limit-per-second.yaml
        X-Ratelimit-Limit-Per-Second-Objects:
          $ref: ../headers/x-ratelimit-limit-per-second-objects.yaml
        X-Ratelimit-Remaining:
          $ref: ../headers/x-ratelimit-remaining.yaml
        X-Ratelimit-Remaining-Objects:
          $ref: ../headers/x-ratelimit-remaining-objects.yaml
        X-Ratelimit-Seconds-To-Refresh-Limit:
          $ref: ../headers/x-ratelimit-seconds-to-refresh-limit.yaml
        X-Ratelimit-Seconds-To-Refresh-Limit-Objects:
          $ref: ../headers/x-ratelimit-seconds-to-refresh-limit-objects.yaml
      content:
        application/json:
          example:
            $ref: ../examples/201.json
          schema:
            $ref: ../schemas/rate-limit-status-response.yaml
    400:
      $ref: ../errors/400.yaml
    403:
      $ref: ../errors/403.yaml
    429:
      $ref: ../errors/429-url.yaml
    500:
      $ref: ../errors/500.yaml
