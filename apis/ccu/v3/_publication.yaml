# Identifies the ReadMe project to publish in, corresponding to:
# https://techdocs.akamai.com/{id}/reference
id: purge-cache
# Official marketing title of the API, matching the page above
title: Fast Purge API
# Major API version, which typically appears in the API's URLs
version: v3
service-type: DELIVERY
service-summary: |
  Refresh or remove specific cached objects, by URLs, content
  provider (CP) codes, or cache tags.
# Whether these files distribute to public Github:
# https://techdocs.akamai.com/internal-ux-writing/docs/swag-tool-extensions#exclude-the-entire-openapi-bundle
exclude:
  exclude-from-github: false
# Use this ID to create custom links in Run in Postman buttons
# https://techdocs.akamai.com/internal-ux-writing/docs/swag-tool-post#create-a-custom-button
postman-config:
  postman-collection-id: 13085889-5539390c-8300-42bd-9a65-609c5ee73441
  overview-description: |
    Use the Fast Purge API to purge edge content, including URLs, ARLs (Akamai resource locators), or any content grouped under a content provider (CP) code or cache tag.

  dependencies: |
    - To purge by a directory or extension, use the [Enhanced Content Control Utility API](https://techdocs.akamai.com/eccu/reference/api).
    - To purge streaming or media content, use the [Media Services API](https://techdocs.akamai.com/msl/pdfs/media-services-api-user-guide.pdf).