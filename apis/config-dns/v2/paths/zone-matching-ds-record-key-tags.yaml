x-akamai:
  path-info: /zones/{zone}/matching-ds-record-key-tags
parameters:
- $ref: ../parameters/zone-path.yaml
get:
  operationId: get-zones-zone-matching-ds-record-key-tags
  summary: Get matching DS record key tags
  tags:
  - DNSSEC keys
  description: |
    Returns the key tag values from DS records in the parent zone that match the zone's current DNSKEY records. Use this to verify DS delegation is correctly configured.
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/matching-ds-record-key-tags-get.json
          schema:
            $ref: ../schemas/ds-record-key-tag-response.yaml
