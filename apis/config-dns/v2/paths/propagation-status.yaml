x-akamai:
  path-info: /zones/propagation-status
post:
  operationId: post-zones-propagation-status
  summary: Get zone propagation status
  tags:
  - Zones
  description: |
    Returns the current propagation status for one or more zones, showing what percentage of name servers have received the latest zone data.
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/zone-name-list.json
        schema:
          $ref: ../schemas/zone-name-list.yaml
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/propagation-status-post-response.json
          schema:
            $ref: ../schemas/propagation-status-response.yaml
