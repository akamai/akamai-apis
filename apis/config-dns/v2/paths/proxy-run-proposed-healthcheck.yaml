x-akamai:
  path-info: /proxies/{proxyId}/healthcheck/run-proposed
post:
  operationId: post-run-proposed-proxy-healthcheck
  summary: Run proposed proxy health check for origin name servers
  tags:
    - DNS proxy health check
  description: |
    Runs a proposed health check on the proxy.
  parameters:
    - $ref: ../parameters/proxy-id-path.yaml
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/proxy-post-run-proposed-request.json
        schema:
          $ref: ../schemas/proxy-post-run-proposed-request.yaml
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/proxy-run-healthcheck.json
          schema:
            $ref: ../schemas/proxy-run-healthcheck.yaml
