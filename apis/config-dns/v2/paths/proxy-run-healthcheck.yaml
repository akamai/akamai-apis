x-akamai:
  path-info: /proxies/{proxyId}/healthcheck/run
post:
  operationId: post-run-proxy-healthcheck
  summary: Run existing proxy health check
  tags:
    - DNS proxy health check
  description: |
    Runs the health check currently defined on the proxy.
  parameters:
    - $ref: ../parameters/proxy-id-path.yaml
  responses:
    200:
      description: |
        Successful response.
      content:
        application/json:
          example:
            $ref: ../examples/proxy-run-healthcheck.json
          schema:
            $ref: ../schemas/proxy-run-healthcheck.yaml
