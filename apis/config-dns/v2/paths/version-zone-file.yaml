x-akamai:
  path-info: /zones/{zone}/versions/{uuid}/zone-file
parameters:
- $ref: ../parameters/uuid-path.yaml
- $ref: ../parameters/zone-path.yaml
get:
  operationId: get-zones-zone-versions-uuid-zone-file
  summary: Get a version's master zone file
  tags:
  - Zone file
  description: |
    Downloads the record sets from a prior zone version in [master zone file](ref:get-zone-versions-uuid) format. This applies to primary and secondary zones.
  responses:
    200:
      description: |
        Successful response.
      content:
        text/dns:
          example:
            $ref: ../examples/db.example.com
          schema:
            type: string
