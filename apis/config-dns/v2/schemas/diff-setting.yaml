type: object
description: |
  The difference in a settings value between two versions.
additionalProperties: false
required:
- fieldName
- operation
properties:
  fieldName:
    type: string
    description: |
      The name of the settings value that changed.
  operation:
    type: string
    description: |
      The type of difference. An `ADD` difference contains the `toValue` and a `DELETE` difference contains a `fromValue`. An `EDIT` difference contains both fields.
    enum:
    - ADD
    - DELETE
    - EDIT
  fromValue:
    description: |
      The prior value of the settings field or record set. This may be any type of data, depending on the field that changed. The value isn't present for an `ADD` difference.
    oneOf:
    - title: Boolean
      type: boolean
      nullable: true
    - title: Integer
      type: integer
      nullable: true
    - title: Object
      type: object
      nullable: true
    - title: String
      type: string
      nullable: true
  toValue:
    description: |
      The new value of the settings field or record set. This may be any type of data, depending on the field that changed. The value isn't present for a `DELETE` difference.
    oneOf:
    - title: Boolean
      type: boolean
      nullable: true
    - title: Integer
      type: integer
      nullable: true
    - title: Object
      type: object
      nullable: true
    - title: String
      type: string
      nullable: true
