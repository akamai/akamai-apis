type: object
description: |
  A modification of a record set inside a change list.
additionalProperties: false
required:
- name
- type
- ttl
- rdata
- state
properties:
  name:
    type: string
    description: |
      The DNS name of this record.
  type:
    type: string
    description: |
      The record type.
  rdata:
    type: array
    description: |
      Data strings, representing multiple records within a set. The format of the `rdata` strings depend on the `type` of this record. Not used When the `op` value for the PATCH request is DELETE.
    items:
      type: string
  state:
    type: string
    description: |
      The state of this record in the change list. A `PRISTINE` record hasn't been changed, otherwise it has been `ADDED`, `EDITED`, or `DELETED`.
    enum:
    - PRISTINE
    - ADDED
    - EDITED
    - DELETED
  ttl:
    type: integer
    minimum: 0
    description: |
      The number of seconds this record should live in a resolver's cache before being refetched. A value of `0` means the record is uncached. Not used when the `op` value for the PATCH request is `DELETE`.
