additionalProperties: false
type: object
required:
- propagationStatuses
properties:
  propagationStatuses:
    description: Propagation status for each requested zone.
    type: array
    items:
      additionalProperties: false
      type: object
      required:
      - zone
      properties:
        zone:
          description: The zone name.
          type: string
        serial:
          description: The current SOA serial number for the zone.
          type: integer
          format: int64
        percentCurrent:
          description: Percentage of name servers that have the current zone data.
          type: integer
        percentInProgress:
          description: Percentage of name servers currently receiving zone data.
          type: integer
        percentNotReported:
          description: Percentage of name servers that have not yet reported their status.
          type: integer
