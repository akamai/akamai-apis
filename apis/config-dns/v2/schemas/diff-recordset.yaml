type: object
description: |
  The difference in a record set between two versions.
additionalProperties: false
required:
- name
- type
- operation
properties:
  name:
    type: string
    description: |
      The name of the record set that changed.
  type:
    type: string
    description: |
      The type of the record set that changed.
  operation:
    type: string
    description: |
      The type of difference. An `ADD` difference contains the `toValue` but not a `fromValue`. A `DELETE` difference is the other way around. An `EDIT` difference has both fields.
    enum:
    - ADD
    - DELETE
    - EDIT
  fromValue:
    description: |
      The prior value of the settings field or record set. This may be any type of data, depending on the field that changed. The value doesn't exist on an `ADD` difference.
    oneOf:
    - title: Boolean
      type: boolean
      nullable: true
    - title: Integer
      type: integer
      nullable: true
    - title: Object
      type: object
      nullable: true
    - title: String
      type: string
      nullable: true
  toValue:
    description: |
      The new value of the settings field or record set. This may be any type of data, depending on the field that changed. The value doesn't exist on an `DELETE` difference.
    oneOf:
    - title: Boolean
      type: boolean
      nullable: true
    - title: Integer
      type: integer
      nullable: true
    - title: Object
      type: object
      nullable: true
    - title: String
      type: string
      nullable: true
