type: object
description: |
  A modification of a record set inside a change list.
additionalProperties: false
required:
- name
- type
- op
properties:
  name:
    type: string
    description: |
      The DNS name of this record.
  type:
    type: string
    description: |
      The record type.
  op:
    type: string
    description: |
      The requested operation. You can `ADD`, `EDIT`, or `DELETE` a record set.
    enum:
    - ADD
    - EDIT
    - DELETE
  rdata:
    type: array
    description: |
      Data strings, representing multiple records within a set. The format of the `rdata` strings depend on the `type` of this record. Not used when `PATCH`ing a `DELETE` operation.
    items:
      type: string
  ttl:
    type: integer
    minimum: 0
    description: |
      The number of seconds this record should live in a resolver's cache before being refetched. A value of `0` means the record is uncached. Not used when `PATCH`ing a `DELETE` operation.
