type: object
description: |
  Proxy details.
additionalProperties: false
required:
- id
- name
- contractId
- activationState
- createdTime
- originNameservers
- authorities
- healthCheck
properties:
  id:
    type: string
    description: |
      The unique proxy ID.
  name:
    type: string
    description: |
      The proxy name.
  contractId:
    type: string
    description: |
      The contract for this proxy.
  activationState:
    description: |
      The current proxy activation status. Either `NEW`, `PENDING`, `ACTIVE`, `LOCKED`, `DELETED`, or `ERROR`.
    enum:
    - NEW
    - PENDING
    - ACTIVE
    - LOCKED
    - DELETED
    - ERROR
  createdTime:
    type: string
    description: |
      An ISO 8601 timestamp showing when the proxy was created.
    format: date-time
  lastModifiedTime:
    type: string
    description: |
      An ISO 8601 timestamp showing when the proxy was last modified.
    format: date-time
  originNameservers:
    type: array
    description: |
      The names or addresses of the master name servers to protect.
    items:
      $ref: nameserver-get.yaml
  zoneTransferNameservers:
    type: array
    description: |
      The names or addresses to perform outbound zone transfers with `filter_mode` of `AUTOMATIC`. If this field is omitted the `originNameserverZoneTransferTargets` section is used.
    items:
      $ref: nameserver-get.yaml
  originNameserverZoneTransferTargets:
    type: array
    deprecated: true
    x-akamai:
      status: DEPRECATED
    description: |
      The names or addresses to perform outbound zone transfers with `filter_mode` of `AUTOMATIC`. If this field is omitted the `originNameservers` section is used.
    items:
      type: string
  authorities:
    type: array
    minItems: 0
    uniqueItems: true
    description: |
      The authoritative service IPs.
    items:
      type: string
  authoritiesDnsNames:
    minItems: 0
    uniqueItems: true
    type: array
    description: |
      The authoritative service NS records.
    items:
      type: string
  healthCheck:
    $ref: proxy-healthcheck-get.yaml
