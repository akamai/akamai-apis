type: object
additionalProperties: false
required:
- metadata
- recordsets
properties:
  metadata:
    type: object
    description: |
      Information about the request.
    additionalProperties: false
    required:
    - zone
    - page
    - pageSize
    - totalElements
    - types
    properties:
      page:
        type: integer
        description: |
          Current page.
        minimum: 1
      pageSize:
        type: integer
        description: |
          The number of results per page.
        minimum: 1
      totalElements:
        type: integer
        description: |
          The total number of results.
        minimum: 0
      zone:
        type: string
        description: |
          The name of the zone.
        minLength: 0
      types:
        type: array
        description: |
          Reflects the set of record types that were requested.
        minItems: 0
        uniqueItems: true
        items:
          type: string
  recordsets:
    type: array
    description: |
      One or more record sets.
    items:
      $ref: recordset.yaml
