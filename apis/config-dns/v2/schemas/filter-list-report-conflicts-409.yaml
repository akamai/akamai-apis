type: object
description: |
  An Edge DNS proxy zone manual config list report conflict error.
additionalProperties: true
properties:
  type:
    type: string
    description: |
      A non-navigable URI that identifies each error case.
    format: uri
  title:
    type: string
    description: |
      Error type name.
  instance:
    type: string
    description: |
      Error instance.
  status:
    type: integer
    description: |
      The HTTP error status code.
  detail:
    type: string
    description: |
      Detailed description of the error.
  problemId:
    type: string
    description: |
      Problem instance ID.
  manualConfigName:
    type: string
    description: |
      The conflicting manual configuration name.
