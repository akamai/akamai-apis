type: object
description: |
  An Edge DNS proxy zone manual config list report limit error.
additionalProperties: true
properties:
  type:
    type: string
    description: |
      A non-navigable URI that identifies each error case.
  title:
    type: string
    description: |
      Error name.
  instance:
    type: string
    description: |
      Error instance.
  status:
    type: integer
    description: |
      HTTP error status.
  detail:
    type: string
    description: |
      Detailed description of the error.
  problemId:
    type: string
    description: |
      Problem instance ID.
  contractId:
    type: string
    description: |
      Contract that this occurred on.
  maximumManualConfigs:
    type: integer
    description: |
      Maximum allowed manual config entries on the contract for a given proxy zone.
  proxyId:
    type: integer
    description: |
      id
