type: object
description: |
  Akamai zone transfer agents that performed zone transfers.
additionalProperties: false
required:
- agentIP
- actions
properties:
  agentIP:
    type: string
    description: |
      The IP address of the Akamai zone transfer agent.
    readOnly: true
  lastFailureTimestamp:
    type: string
    description: |
      The ISO 8601 timestamp indicating the last time a zone transfer failed for this agent.
    readOnly: true
    format: date-time
  actions:
    type: array
    description: |
      The zone transfer requests performed by the agent.
    readOnly: true
    items:
      $ref: zone-transfer-action.yaml
