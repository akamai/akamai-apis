type: object
description: |
  A Proxy.
additionalProperties: false
required:
- name
- contractId
- originNameservers
- healthCheck
properties:
  id:
    type: string
    description: |
      The proxy ID.
  name:
    type: string
    description: |
      The proxy name.
  contractId:
    type: string
    description: |
      The contract for this proxy.
  activationState:
    type: string
    description: |
      The current proxy activation status. Either `NEW`, `PENDING`, `ACTIVE`, `LOCKED`, `DELETED`, or `ERROR`.
    readOnly: true
    enum:
    - NEW
    - PENDING
    - ACTIVE
    - LOCKED
    - DELETED
    - ERROR
  createdTime:
    type: string
    description: |
      An ISO 8601 timestamp showing when the proxy was created.
    format: date-time
  lastModifiedTime:
    type: string
    description: |
      An ISO 8601 timestamp showing when the proxy was last modified.
    format: date-time
  originNameservers:
    type: array
    description: |
      The names or addresses of the master name servers to protect.
    items:
      $ref: nameserver-get.yaml
  zoneTransferNameservers:
    type: array
    description: |
      The names or addresses to perform outbound zone transfers with `filter_mode` of `AUTOMATIC`. If this field is omitted the `originNameserverZoneTransferTargets` section is used.
    items:
      $ref: nameserver-get.yaml
  originNameserverZoneTransferTargets:
    type: array
    deprecated: true
    x-akamai:
      status: DEPRECATED
    description: |
      The names or addresses to perform outbound zone transfers for `AUTOMATIC` filter mode. The default value is the `originNameservers` section.
    items:
      type: string
  authorities:
    type: array
    description: |
      The authoritative service IPs set by Akamai. Any changes you make to `authorities` are ignored.
    readOnly: true
    items:
      type: string
  authoritiesDnsNames:
    type: array
    description: |
      NS records for the the authoritative service IPs set by Akamai. Any changes you make to `authoritiesDnsNames` are ignored.
    readOnly: true
    items:
      type: string
  healthCheck:
    $ref: proxy-healthcheck-get.yaml
