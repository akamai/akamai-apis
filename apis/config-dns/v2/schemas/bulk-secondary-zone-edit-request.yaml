additionalProperties: false
type: object
required:
- zones
- settings
properties:
  zones:
    description: List of secondary zones to edit, each identified by name and current version ID.
    type: array
    items:
      additionalProperties: false
      type: object
      required:
      - zone
      - versionId
      properties:
        zone:
          description: The zone name.
          type: string
        versionId:
          description: The current `ETag` version identifier for the zone.
          type: string
  settings:
    description: Secondary zone settings to apply to all listed zones.
    additionalProperties: false
    type: object
    properties:
      masters:
        description: List of primary name server IP addresses for zone transfer.
        type: array
        items:
          type: string
      comment:
        description: Free-form comment about the change.
        type: string
