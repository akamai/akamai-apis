openapi: 3.0.0
info:
  title: Zones
  version: v2
servers:
- url: https://{hostname}/config-dns/v2
tags:
- description: Groups operations to manage zones.
  name: Zones
- description: Groups operations to get the current DNSSEC status for zones.
  name: DNSSEC status
- description: Groups operations to get the current DNSSEC DNSKEY records for zones.
  name: DNSSEC keys
- description: Groups operations to get results of the most recent zone transfer attempts.
  name: Zone transfer status
- description: Groups operations to get details about the contract that  zone belongs
    to.
  name: Zone contracts
x-akamai:
  auth-type: EDGE_GRID
paths:
  /zones:
    $ref: paths/zones.yaml
  /zones/dns-sec-status:
    $ref: paths/dns-sec-status.yaml
  /zones/{zone}/dnskeys:
    $ref: paths/dnskeys.yaml
  /zones/zone-transfer-status:
    $ref: paths/zone-transfer-status.yaml
  /zones/{zone}:
    $ref: paths/zone.yaml
  /zones/{zone}/aliases:
    $ref: paths/aliases.yaml
  /zones/{zone}/contract:
    $ref: paths/contract.yaml
  /zones/edit-secondary-zones:
    $ref: paths/edit-secondary-zones.yaml
  /zones/propagation-status:
    $ref: paths/propagation-status.yaml
  /zones/{zone}/schedule-immediate-transfer:
    $ref: paths/zone-schedule-transfer.yaml
  /zones/{zone}/matching-ds-record-key-tags:
    $ref: paths/zone-matching-ds-record-key-tags.yaml
