name: transferStatus
in: query
description: |
  Limits the list to zones matching the specified zone transfer status. Specify any combination of `success`, `warning`, `failure`, and `pending` values.
schema:
  type: array
  items:
    type: string
    enum:
    - success
    - warning
    - failure
    - pending
  example: [success, pending]
explode: false
style: form
