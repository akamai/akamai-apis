name: activationStates
in: query
description: |
  Limits the list to zones in the specified activation states. Specify any combination of `ACTIVE`, `NEW`, `PENDING`, `LOCKED`, and `ERROR` values.
schema:
  type: array
  items:
    type: string
    enum:
    - ACTIVE
    - NEW
    - PENDING
    - LOCKED
    - ERROR
  example: [ACTIVE, PENDING]
explode: false
style: form
