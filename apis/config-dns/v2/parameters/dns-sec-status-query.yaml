name: dnsSecStatus
in: query
description: |
  Limits the list to zones with the specified DNSSEC status. Specify any combination of `valid`, `warning`, and `error` values.
schema:
  type: array
  items:
    type: string
    enum:
    - valid
    - warning
    - error
  example: [valid, warning]
explode: false
style: form
