name: types
in: query
description: |
  Limits the list to one or more Edge DNS zone types. Specify any combination of `PRIMARY`, `SECONDARY`, and `ALIAS` values.
schema:
  type: array
  items:
    type: string
    enum:
    - PRIMARY
    - SECONDARY
    - ALIAS
  example: [PRIMARY, ALIAS]
explode: false
style: form
