x-akamai:
  path-info: /configurations/{configurationId}/acknowledge/{version}
parameters:
- $ref: ../parameters/version-path.yaml
- $ref: ../parameters/configuration-id-path.yaml
put:
  operationId: put-configuration-acknowledge-version
  summary: Acknowledge proposed CIDR blocks
  tags:
  - CIDR blocks
  description: |
    Acknowledges the change. Use it once you review the `proposedCidrs` from Akamai and update your Access Control List (ACL) accordingly.
  responses:
    200:
      description: |
        The response returns an empty success message.
    400:
      $ref: ../errors/400.yaml
    401:
      $ref: ../errors/401.yaml
    403:
      $ref: ../errors/403.yaml
    404:
      $ref: ../errors/404.yaml
    405:
      $ref: ../errors/405.yaml
    500:
      $ref: ../errors/500.yaml
