info:
  title: DataStream 2 configuration
  version: v2
openapi: 3.0.0
paths:
  /log/datasets-fields:
    $ref: paths/datasets-fields.yaml
  /log/groups:
    $ref: paths/groups.yaml
  /log/groups/{groupId}/properties:
    $ref: paths/properties.yaml
  /log/streams:
    $ref: paths/streams.yaml
  /log/streams/metrics:
    $ref: paths/metrics.yaml
  /log/streams/{streamId}:
    $ref: paths/stream.yaml
  /log/streams/{streamId}/activate:
    $ref: paths/activation.yaml
  /log/streams/{streamId}/activation-history:
    $ref: paths/activations.yaml
  /log/streams/{streamId}/deactivate:
    $ref: paths/deactivate.yaml
  /log/streams/{streamId}/history:
    $ref: paths/history.yaml
servers:
- url: https://{hostname}/datastream-config-api/v2
tags:
- description: Manage the groups for your account. Groups control access to properties.
  name: Groups
- description: Get information about the properties available for use with streams.
  name: Properties
- description: Get information about the data sets you can include in your logs.
  name: Data sets
- description: Manage your stream configurations.
  name: Streams
- description: Manage your stream activations.
  name: Activations
- description: Track changes to your stream versions.
  name: History
x-akamai:
  auth-type: EDGE_GRID
