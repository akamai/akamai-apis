x-akamai:
  path-info: /log/streams/{streamId}/activation-history
parameters:
- $ref: ../parameters/stream-id-path.yaml
get:
  operationId: get-stream-activation-history
  summary: View activation history
  tags:
  - Activations
  description: |
    Returns the details of activation status changes for all versions of a given stream.
  x-akamai:
    supports-account-switch-key: false
  responses:
    200:
      description: |
        The response lists changes in stream activation status.
      content:
        application/json:
          example:
            $ref: ../examples/activation-histories-example.json
          schema:
            $ref: ../schemas/activation-histories.yaml
