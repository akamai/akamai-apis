type: object
description: |
  Certificate Signing Request (CSR).
additionalProperties: false
required:
- csrs
properties:
  csrs:
    type: array
    description: |
      Certificate Signing Request (CSR) objects.
    minItems: 0
    items:
      type: object
      additionalProperties: false
      required:
      - csr
      properties:
        csr:
          type: string
          description: |
            String with PEM formatted CSR.
          minLength: 1
        keyAlgorithm:
          type: string
          description: |
            Key algorithm of the certificate, either `ECDSA` or `RSA`.
          enum:
          - ECDSA
          - RSA
