type: object
description: |
  Represents error data in the [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) Problem Details format.
additionalProperties: false
required:
- type
- title
- detail
- instance
properties:
  type:
    type: string
    description: |
      Helps characterize the error.
    minLength: 1
  title:
    type: string
    description: |
      Title of the error.
    minLength: 1
  detail:
    type: string
    description: |
      Descriptive text about the error.
    minLength: 1
  instance:
    type: string
    description: |
      Identifies the error instance.
    minLength: 1
