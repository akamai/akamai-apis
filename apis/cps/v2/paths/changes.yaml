x-akamai:
  path-info: /enrollments/{enrollmentId}/history/changes
parameters:
- $ref: ../parameters/enrollment-id-path.yaml
get:
  operationId: get-history-changes
  summary: Get change history
  tags:
  - Changes
  description: |
    Change history of an enrollment.
  parameters:
  - $ref: ../parameters/include-all-query.yaml
  responses:
    200:
      description: |
        The response reflects details of the changed made to the certificate's history.
      content:
        application/vnd.akamai.cps.change-history.v5+json:
          example:
            $ref: ../examples/change-history.v5.json
          schema:
            $ref: ../schemas/change-history.v5.yaml
