x-akamai:
  path-info: /enrollments/{enrollmentId}/history/certificates
parameters:
- $ref: ../parameters/enrollment-id-path.yaml
get:
  operationId: get-history-certificates
  summary: Get certificate history
  tags:
  - Enrollments
  description: |
    View the certificate history. To view deployed certificates and their expiration dates, run the [Get production deployment](ref:get-deployments-production) operation. Note that for enrollments with six certificates or fewer, the response yields up to twelve years of data per certificate. If there are more than six certificates in the enrollment, the response shows a truncated set. To view all changes or certificates, use the `includeAll=true` query parameter in the request.
  parameters:
  - $ref: ../parameters/include-all-query.yaml
  responses:
    200:
      description: |
        The response reflects details of the certificate's history.
      content:
        application/vnd.akamai.cps.certificate-history.v2+json:
          example:
            $ref: ../examples/certificate-history.v2.json
          schema:
            $ref: ../schemas/certificate-history.v2.yaml
