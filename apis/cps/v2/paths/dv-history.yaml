x-akamai:
  path-info: /enrollments/{enrollmentId}/dv-history
parameters:
- $ref: ../parameters/enrollment-id-path.yaml
get:
  operationId: get-dv-history
  summary: Get DV history
  tags:
  - Enrollments
  description: |
    Domain name Validation history for the enrollment.
  responses:
    200:
      description: |
        The response reflects the enrollment's domain name validation history.
      content:
        application/vnd.akamai.cps.dv-history.v1+json:
          example:
            $ref: ../examples/dv-history.v1.json
          schema:
            $ref: ../schemas/dv-history.v1.yaml
