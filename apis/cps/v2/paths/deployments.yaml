        The response reflects an object with each deployment available within top-level production and staging fields.
      content:
        application/vnd.akamai.cps.deployments.v8+json:
          example:
            $ref: ../examples/deployments.v8-3p.json
          schema:
            $ref: ../schemas/deployments.v8.yaml
