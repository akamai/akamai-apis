x-akamai:
  path-info: /active-certificates
get:
  operationId: get-active-certificates
  summary: List active certificates
  tags:
  - Certificates
  description: |
    Lists enrollments with active certificates. Note that the rate limit for this operation is 10 requests per minute per account. For details, see [Rate limiting](ref:rate-limiting).
  parameters:
  - $ref: ../parameters/contract-id-query.yaml
  responses:
    200:
      description: |
        The response reflects the set of enrollments with active certificates.
      content:
        application/vnd.akamai.cps.active-certificates.v2+json:
          example:
            $ref: ../examples/active-certificates.v2.json
          schema:
            $ref: ../schemas/active-certificates.v2.yaml
