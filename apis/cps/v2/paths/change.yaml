x-akamai:
  path-info: /enrollments/{enrollmentId}/changes/{changeId}
parameters:
- $ref: ../parameters/change-id-path.yaml
- $ref: ../parameters/enrollment-id-path.yaml
get:
  operationId: get-enrollment-change
  summary: Get change status
  tags:
  - Changes
  description: |
    Gets the status of a pending change.
  responses:
    200:
      description: |
        The response reflects the change object's details.
      content:
        application/vnd.akamai.cps.change.v2+json:
          example:
            $ref: ../examples/change.v1-no-error-allowed-input-3p.json
          schema:
            $ref: ../schemas/change.v2.yaml
delete:
  operationId: delete-enrollment-change
  summary: Cancel a change
  tags:
  - Changes
  description: |
    Cancels a pending change. This cancels the entire change. You can cancel any pending change you previously made to a certificate.
  responses:
    200:
      description: |
        The response reflects the URL of the change.
      content:
        application/vnd.akamai.cps.change-id.v1+json:
          example:
            $ref: ../examples/change-id.v1.json
          schema:
            $ref: ../schemas/change-id.v1.yaml
